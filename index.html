  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }\n\n  body {\n    font-family: 'Space Grotesk', sans-serif;\n    background: var(--paper);\n    color: var(--ink);\n    min-height: 100dvh;\n    overflow-x: hidden;\n  }\n\n  /* ── TOP HEADER ── */\n  .header {\n    position: sticky; top: 0; z-index: 100;\n    background: var(--ink);\n    padding: 0 20px;\n    height: 60px;\n    display: flex; align-items: center; justify-content: space-between;\n  }\n  .header-title {\n    font-family: 'Instrument Serif', serif;\n    font-size: 26px; color: var(--paper);\n    line-height: 1.1;\n    letter-spacing: 0.015em; font-weight: 500;\n  }\n  .header-date {\n    font-size: 11px; color: rgba(250,248,245,0.5);\n    margin-top: 2px; letter-spacing: 0.02em; font-weight: 300;\n  }\n  .header-right { display: flex; gap: 6px; align-items: center; }\n  .icon-btn {\n    background: none; border: none; cursor: pointer;\n    color: rgba(250,248,245,0.65); width: 36px; height: 36px;\n    display: flex; align-items: center; justify-content: center;\n    border-radius: 8px;\n    transition: background 0.15s, color 0.15s;\n  }\n  .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--paper); }\n  .icon-btn:active { background: rgba(255,255,255,0.08); }\n\n  /* ── TABS ── */\n  .tabs-wrapper {\n    position: sticky; top: 60px; z-index: 99;\n    background: var(--ink);\n    border-bottom: 1px solid rgba(255,255,255,0.07);\n  }\n  .tabs-scroll {\n    display: flex; overflow-x: auto; gap: 0;\n    padding: 0 8px;\n    -webkit-overflow-scrolling: touch;\n    scrollbar-width: none;\n  }\n  .tabs-scroll::-webkit-scrollbar { display: none; }\n  .tab {\n    flex-shrink: 0;\n    padding: 0 14px;\n    height: var(--tab-h);\n    display: flex; align-items: center; gap: 7px;\n    font-family: 'Space Grotesk', sans-serif;\n    font-size: 12px; font-weight: 400; letter-spacing: 0;\n    color: rgba(250,248,245,0.4);\n    background: none; border: none; cursor: pointer;\n    position: relative;\n    transition: color 0.2s;\n    white-space: nowrap;\n  }\n  .tab.active { color: var(--paper); }\n  .tab.active::after {\n    content: ''; position: absolute; bottom: 0; left: 10px; right: 10px;\n    height: 2px; background: var(--accent);\n    border-radius: 2px 2px 0 0;\n  }\n  .tab-dot {\n    width: 7px; height: 7px; border-radius: 50%;\n    background: currentColor; opacity: 0.5; flex-shrink: 0;\n  }\n  .tab.active .tab-dot { opacity: 1; }\n  .tab-count {\n    font-size: 10px; background: rgba(255,255,255,0.1);\n    border-radius: 10px; padding: 1px 6px; color: var(--paper);\n    opacity: 0.6;\n  }\n  .tab-add {\n    flex-shrink: 0; padding: 0 14px; height: var(--tab-h);\n    display: flex; align-items: center;\n    color: rgba(250,248,245,0.4); font-size: 18px;\n    background: none; border: none; cursor: pointer;\n    border-left: 1px solid rgba(255,255,255,0.08);\n    margin-left: 4px;\n    transition: color 0.15s;\n  }\n  .tab-add:hover { color: var(--paper); }\n\n  /* ── MAIN CONTENT ── */\n  .content {\n    padding: 20px 16px calc(var(--bottom-h) + 20px);\n    min-height: calc(100dvh - 60px - var(--tab-h));\n    transition: opacity 0.18s ease, transform 0.18s ease;\n  }\n  .content.swipe-out-left  { opacity: 0; transform: translateX(-32px); }\n  .content.swipe-out-right { opacity: 0; transform: translateX(32px); }\n  .content.swipe-in-left   { opacity: 0; transform: translateX(32px); }\n  .content.swipe-in-right  { opacity: 0; transform: translateX(-32px); }\n\n  /* ── SECTION LABELS ── */\n  .section-label {\n    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--muted); margin: 20px 0 10px;\n    display: flex; align-items: center; gap: 10px;\n  }\n  .section-label::after {\n    content: ''; flex: 1; height: 1px; background: var(--border);\n  }\n  .section-label.toggle-label { cursor: pointer; user-select: none; }\n  .section-label .section-count { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 10px; }\n  .section-label .mini-switch { width: 26px; height: 15px; border-radius: 8px; background: var(--border); position: relative; flex-shrink: 0; transition: background .15s; }\n  .section-label .mini-switch-knob { position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.35); }\n  .section-label .mini-switch.on { background: var(--ink); }\n  .section-label .mini-switch.on .mini-switch-knob { transform: translateX(11px); }\n  .section-label.shelved-label .mini-switch.on { background: #a87f2e; }\n\n  /* ── PROJECT CARD ── */\n  .project-card {\n    background: var(--card);\n    border: 1px solid var(--border);\n    border-left-width: 3px;\n    border-radius: var(--radius);\n    margin-bottom: 8px;\n    overflow: hidden;\n    box-shadow: var(--shadow-sm);\n    transition: box-shadow 0.2s, transform 0.15s;\n    animation: cardIn 0.22s ease both;\n    animation-delay: calc(var(--card-i, 0) * 40ms);\n  }\n  @keyframes cardIn {\n    from { opacity: 0; transform: translateY(10px); }\n    to   { opacity: 1; transform: none; }\n  }\n  .project-card:active { transform: scale(0.995); }\n  @media (hover: hover) { .project-card:hover { box-shadow: var(--shadow); } }\n  .card-header {\n    padding: 14px 14px 12px;\n    display: flex; align-items: flex-start; gap: 0;\n    cursor: pointer;\n  }\n  .card-color-bar { display: none; }\n  .card-main { flex: 1; min-width: 0; }\n  .card-title {\n    font-family: 'Instrument Serif', serif;\n    font-size: 21px; line-height: 1.3;\n    letter-spacing: 0.015em;\n    color: var(--ink);\n    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\n  }\n  .card-title-row {\n    display: flex; align-items: flex-start; justify-content: space-between;\n    gap: 8px; margin-bottom: 5px;\n  }\n  .card-meta {\n    font-size: 11px; color: var(--muted);\n    letter-spacing: 0.01em;\n    display: flex; gap: 12px; flex-wrap: wrap;\n  }\n  .card-meta span { display: flex; align-items: center; gap: 4px; }\n  .card-chevron {\n    flex-shrink: 0; color: var(--muted); margin-top: 4px; margin-left: 10px;\n    transition: transform 0.22s cubic-bezier(0.34,1.2,0.64,1);\n    opacity: 0.4; display: flex; align-items: center;\n  }\n  .card-chevron.open { transform: rotate(180deg); opacity: 0.7; }\n\n  /* Progress bar */\n  .card-progress-wrap { padding: 0 14px 13px; }\n  .progress-row { display: flex; align-items: center; gap: 10px; }\n  .progress-pct {\n    font-size: 11px; color: var(--muted);\n    display: flex; align-items: center; gap: 6px;\n    white-space: nowrap; flex-shrink: 0;\n  }\n  .cb-frac { font-size: 10px; opacity: 0.7; letter-spacing: 0.02em; }\n  .cb-check {\n    display: inline-flex; align-items: center; justify-content: center;\n    width: 14px; height: 14px; border-radius: 50%;\n    background: var(--accent2); color: white;\n    font-size: 9px; line-height: 1; margin-left: 1px;\n  }\n  .progress-track {\n    flex: 1; height: 4px; background: var(--paper2);\n    border-radius: 4px; overflow: hidden; cursor: pointer;\n  }\n  .progress-track.checkbox-driven { cursor: default; }\n  .checkbox-progress-note {\n    font-size: 10px; letter-spacing: 0.04em; color: var(--muted);\n    background: var(--paper2); border: 1px solid var(--border);\n    border-radius: 8px; padding: 8px 12px;\n    display: flex; align-items: center; gap: 8px; line-height: 1.4;\n    margin-bottom: 12px;\n  }\n  .checkbox-progress-note svg { flex-shrink: 0; opacity: 0.6; }\n  .progress-fill {\n    height: 100%; border-radius: 4px;\n    width: var(--w, 0%);\n    animation: progressLoad 0.55s cubic-bezier(0.22,1,0.36,1) both;\n    animation-delay: calc(var(--card-i, 0) * 40ms + 100ms);\n  }\n  @keyframes progressLoad {\n    from { width: 0; }\n    to   { width: var(--w, 0%); }\n  }\n\n  /* Expanded body */\n  .card-body {\n    display: none; padding: 0 14px 1 ransform: uppercase;\n    color: var(--muted); margin-bottom: 40px;\n  }\n  .auth-card {\n    width: 100%; max-width: 360px;\n    background: var(--card); border-radius: 16px;\n    padding: 28px 24px; margin-bottom: 16px;\n  }\n  .auth-card-title {\n    font-family: 'Instrument Serif', serif;\n    font-size: 24px; line-height: 1.2; letter-spacing: 0.015em; color: var(--ink);\n    margin-bottom: 8px;\n  }\n  .auth-card-sub {\n    font-size: 11px; color: var(--muted); line-height: 1.5;\n    margin-bottom: 20px; letter-spacing: 0.04em;\n  }\n  .auth-input {\n    width: 100%; font-family: 'Space Grotesk', sans-serif;\n    font-size: 14px; color: var(--ink);\n    background: var(--paper); border: 1px solid var(--border);\n    border-radius: 10px; padding: 12px 14px;\n    outline: none; margin-bottom: 12px;\n    -webkit-appearance: none;\n  }\n  .auth-input:focus { border-color: var(--ink); }\n  .auth-btn {\n    width: 100%; font-family: 'Space Grotesk', sans-serif;\n    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;\n    background: var(--accent); color: white;\n    border: none; border-radius: 10px; padding: 14px;\n    cursor: pointer; transition: opacity 0.15s; margin-bottom: 8px;\n  }\n  .auth-btn:active { opacity: 0.8; }\n  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n  .auth-btn-local {\n    width: 100%; font-family: 'Space Grotesk', sans-serif;\n    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n    background: none; color: var(--muted);\n    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px;\n    cursor: pointer; transition: color 0.15s;\n  }\n  .auth-btn-local:hover { color: var(--paper); }\n  .auth-msg {\n    font-size: 12px; text-align: center; min-height: 18px;\n    margin-top: 4px; letter-spacing: 0.04em;\n  }\n  .auth-msg.ok  { color: var(--accent2); }\n  .auth-msg.err { color: var(--accent); }\n  .auth-otp { display: none; }\n  .auth-otp.visible { display: block; }\n  .auth-u ex: 4;\n    transform: rotate(45deg);\n    border-radius: 3px;\n    box-shadow: 0 1px 4px rgba(0,0,0,0.2);\n    transition: transform 0.15s;\n  }\n  .gantt-milestone:hover { transform: rotate(45deg) scale(1.2); }\n  .gantt-open-arrow {\n    position: absolute; top: 6px; right: 0; height: 24px;\n    width: 24px; display: flex; align-items: center; justify-content: center;\n    color: white; font-size: 14px; z-index: 3;\n  }\n  .gantt-popup {\n    position: fixed; z-index: 9000;\n    background: var(--card); border: 1px solid var(--border);\n    border-radius: 12px; padding: 14px 16px;\n    box-shadow: 0 8px 32px rgba(26,26,46,0.25);\n    max-width: 260px; width: 260px;\n    animation: fadeIn 0.15s ease;\n  }\n  .gantt-popup-title {\n    font-family: 'Instrument Serif', serif;\n    font-size: 19px; line-height: 1.25; letter-spacing: 0.015em; color: var(--ink); margin-bottom: 6px;\n  }\n  .gantt-popup-meta {\n    font-size: 10px; color: var(--muted);\n    letter-spacing: 0.06em; margin-bottom: 8px;\n    display: flex; flex-wrap: wrap; gap: 5px;\n  }\n  .gantt-popup-progress {\n    height: 5px; background: var(--paper2);\n    border-radius: 3px; overflow: hidden; margin-bottom: 10px;\n  }\n  .gantt-popup-progress-fill { height: 100%; border-radius: 3px; }\n  .gantt-popup-desc {\n    font-size: 11px; color: #4a4550; line-height: 1.5;\n    max-height: 55px; overflow: hidden; margin-bottom: 10px;\n  }\n  .gantt-popup-actions { display: flex; gap: 6px; }\n  .gantt-popup-btn {\n    font-family: 'Space Grotesk', sans-serif; font-size: 10px;\n    letter-spacing: 0.08em; text-transform: uppercase;\n    border: 1px solid var(--border); background: var(--paper2);\n    color: var(--ink); border-radius: 6px; padding: 6px 10px;\n    cursor: pointer;\n  }\n  .gantt-popup-btn:active { background: var(--border); }\n  @media (min-width: 900px) {\n    .gantt-sidebar { width: 180px; }\n    .gantt-row-label { font-size: 12px; }\n    .gantt-wrap { height: calc(100dvh - 60px - 102px); }\n  }\n<\u002Fstyle>\n<script src=\"6e6320a4-cc24-4d16-b2e2-4a143ad04ee8\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n\n<!-- AUTH SCREEN -->\n<div class=\"auth-screen\" id=\"authScreen\">\n  <div class=\"auth-logo\">Projects<\u002Fdiv>\n  <div class=\"auth-sub\">Personal Dashboard<\u002Fdiv>\n\n  <!-- PRIMARY: Local use -->\n  <div class=\"auth-card\" style=\"margin-bottom:12px\">\n    <div class=\"auth-card-title\">Use without an account<\u002Fdiv>\n    <div class=\"auth-card-sub\" style=\"margin-bottom:16px\">Your projects are saved on this device. No login required. This is the right choice for most users.<\u002Fdiv>\n    <button class=\"auth-btn\" onclick=\"authContinueLocal()\">Get Started<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- SECONDARY: Sign in -->\n  <div style=\"width:100%;max-width:360px;padding:0 4px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n      <div style=\"flex:1;height:1px;background:rgba(255,255,255,0.1)\"><\u002Fdiv>\n      <span style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#4a4a6a\">Authorized sync<\u002Fspan>\n      <div style=\"flex:1;height:1px;background:rgba(255,255,255,0.1)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11px;color:#4a4a6a;line-height:1.6;margin-bottom:12px;letter-spacing:0.03em;text-align:center\">\n      Cross-device sync is only available to invited users.<br>If you weren't given access, use the option above.\n    <\u002Fdiv>\n    <div id=\"authEmailStep\">\n      <input type=\"email\" class=\"auth-input\" id=\"authEmail\" placeholder=\"Authorized email address\" autocomplete=\"email\" style=\"background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12);color:var(--paper)\">\n      <button class=\"auth-btn-local\" id=\"authSendBtn\" onclick=\"authSendOTP()\" style=\"border-color:rgba(255,255,255,0.2)\">Sign in to sync →<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"authOTPStep\" class=\"auth-otp\">\n      <div class=\"auth-card-sub\" id=  <!-- Checkbox -->\n          <button type=\"button\" class=\"md-tb-btn\" onclick=\"mdInsert('checkbox')\" title=\"Task / Checkbox\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"><\u002Frect><polyline points=\"9 12 11 14 15 10\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"md-tb-sep\"><\u002Fdiv>\n          <!-- Bold -->\n          <button type=\"button\" class=\"md-tb-btn\" onclick=\"mdInsert('bold')\" title=\"Bold\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z\"><\u002Fpath><path d=\"M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <!-- Italic -->\n          <button type=\"button\" class=\"md-tb-btn\" onclick=\"mdInsert('italic')\" title=\"Italic\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"4\" x2=\"10\" y2=\"4\"><\u002Fline><line x1=\"14\" y1=\"20\" x2=\"5\" y2=\"20\"><\u002Fline><line x1=\"15\" y1=\"4\" x2=\"9\" y2=\"20\"><\u002Fline><\u002Fsvg>\n          <\u002Fbutton>\n          <!-- Highlight -->\n          <button type=\"button\" class=\"md-tb-btn\" onclick=\"mdInsert('highlight')\" title=\"Highlight\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <!-- St "md-tb-btn\" onclick=\"mdInsert('h2')\" title=\"Heading\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12h8M4 6v12M12 6v12\"><\u002Fpath><path d=\"M17 12h3M17 10v8\" stroke-width=\"1.8\"><\u002Fpath><path d=\"M17 18h3\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <!-- Divider -->\n          <button type=\"button\" class=\"md-tb-btn\" onclick=\"mdInsert('divider')\" title=\"Horizontal divider\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\" stroke-width=\"1\" opacity=\"0.3\"><\u002Fline><line x1=\"3\" y1=\"18\" x2=\"21\" y2=\"18\" stroke-width=\"1\" opacity=\"0.3\"><\u002Fline><\u002Fsvg>\n          <\u002Fbutton>\n          <!-- Inline code -->\n          <button type=\"button\" class=\"md-tb-btn\" onclick=\"mdInsert('code')\" title=\"Inline code\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"16 18 22 12 16 6\"><\u002Fpolyline><polyline points=\"8 6 2 12 8 18\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Color<\u002Flabel>\n        <div class=\"color-picker\" id=\"colorPicker\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Priority<\u002Flabel>\n        <div class=\"priority-picker\" id=\"priorityPicker\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Initial Progress (%)<\u002Flabel>\n        <div class=\"slider-wrap\">\n          <div class=\"progress-row\">\n            <input type=\"range\" id=\"projProgress\" min=\"0\" max=\"100\" value=\"0\" oninput=\"document.getElementById('projProgressVal').textContent=this.value+'%'\">\n            <span class=\"progress-pct\" id=\"projProgressVal\">0%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Start Date<\u002Flabel>\n        <input type=\"date\" id=\"projStart\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Deadline<\u002Flabel>\n        <input type=\"date\" id=\"projDeadline\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>List<\u002Flabel>\n        <select id=\"projTab\"><\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sheet-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeSheet('projectOverlay')\">Cancel<\u002Fbutton>\n      <button class=\"btn-primary\" onclick=\"saveProject()\">Save Project<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- NEW LIST SHEET -->\n<div class=\"overlay\" id=\"tabOverlay\" onclick=\"overlayClose(event,'tabOverlay')\">\n  <div class=\"sheet tab-modal\">\n    <div class=\"sheet-handle\"><\u002Fdiv>\n    <div class=\"sheet-title\">New List<\u002Fdiv>\n    <div class=\"field\" style=\"padding:0 0 16px\">\n      <label>List Name<\u002Flabel>\n      <input type=\"text\" id=\"newTabName\" placeholder=\"e.g. Writing, Research…\" maxlength=\"24\">\n    <\u002Fdiv>\n    <div class=\"field\" style=\"padding:0 0 16px\">\n      <label>Color<\u002Flabel>\n      <div class=\"color-picker\" id=\"tabColorPicker\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sheet-footer\" style=\"padding:0\">\n      <button class=\"btn-secondary\" onclick=\"closeSheet('tabOverlay')\">Cancel<\u002Fbutton>\n      <button class=\"btn-primary\" onclick=\"saveNewTab()\">Create List<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- EDIT LIST SHEET -->\n<div class=\"overlay\" id=\"editTabOverlay\" onclick=\"overlayClose(event,'editTabOverlay')\">\n  <div class=\"sheet tab-modal\">\n    <div class=\"sheet-handle\"><\u002Fdiv>\n    <div class=\"sheet-title\">Edit List<\u002Fdiv>\n    <div class=\"field\" style=\"padding:0 0 16px\">\n      <label>List Name<\u002Flabel>\n      <input type=\"text\" id=\"editTabName\" placeholder=\"List name…\" maxlength=\"24\">\n    <\u002Fdiv>\n    <div class=\"field\" style=\"padding:0 0 16px\">\n      <label>Color<\u002Flabel>\n      <div class=\"color-picker\" id=\"editTabColorPicker\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sheet-footer\" style=\"padding:0; flex-wrap:wrap; gap:8px\">\n      <button class=\"btn-secondary\" style=\"color:var(--accent);border-color:#f5c6c1\" onclick=\"deleteTab()\">Delete List<\u002Fbutton>\n      <button class=\"btn-secondary\" onclick=\"closeSheet('editTabOverlay')\">Cancel<\u002Fbutton>\n      <button class=\"btn-primary\" onclick=\"saveEditTab()\">Save<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- BACKUP SHEET -->\n<div class=\"overlay\" id=\"backupOverlay\" onclick=\"overlayClose(event,'backupOverlay')\">\n  <div class=\"sheet tab-modal\" style=\"max-height:85dvh;overflow-y:auto\">\n    <div class=\"sheet-handle\"><\u002Fdiv>\n    <div class=\"sheet-title\">Settings<\u002Fdiv>\n    <div style=\"padding:0 0 20px\">\n      <div class=\"backup-info\">\n        <strong>Storage status:<\u002Fstrong> <span id=\"backupStatusText\">checking…<\u002Fspan><br>\n        Your data is saved automatically. Use the buttons below to export a backup file or restore from one.\n      <\u002Fdiv>\n      <div class=\"backup-row\">\n        <button class=\"btn-backup primary\" onclick=\"exportBackup()\">⬇ Export Backup<\u002Fbutton>\n        <button class=\"btn-backup\" onclick=\"document.getElementById('importFile').click()\">⬆ Import Backup<\u002Fbutton>\n      <\u002Fdiv>\n      <input type=\"file\" id=\"importFile\" accept=\".json\" onchange=\"importBackup(event)\">\n      <div style=\"font-size:10px;color:var(--muted);letter-spacing:0.06em;line-height:1.7;margin-top:8px\">\n        Export saves a <strong>.json<\u002Fstrong> file to your Downloads. Import will replace your current data.<br>\n        Tip: Export to Google Drive or email for cloud backup.\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid var(--border)\">\n        <label style=\"display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px\">Account<\u002Flabel>\n        <div id=\"backupAuthSigned\" style=\"display:none\">\n          <div style=\"font-size:12px;color:var(--ink);margin-bottom:10px\">Signed in as <strong id=\"backupAuthEmail\"><\u002Fstrong><\u002Fdiv>\n          <button class=\"btn-backup\" onclick=\"authSignOut();closeSheet('backupOverlay')\">Sign Out<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"backupAuthLocal\" style=\"display:none\">\n          <div style=\"font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5\">Using local storage — your data stays on this device. Cross-device sync is available to invited users only.<\u002Fdiv>\n          <button class=\"btn-backup primary\" onclick=\"backupSheetSignIn()\">Sign In to Sync →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sheet-footer\" style=\"padding:0\">\n      <button class=\"btn-primary\" onclick=\"closeSheet('backupOverlay')\">Done<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ─── SUPABASE CONFIG ────────────────────────────────────\nconst SUPABASE_URL = 'https://dxplietmqbpncikyhwve.supabase.co';\nconst SUPABASE_KEY = 'sb_publishable_1yrXYKJBq8O51o_PFw7HhQ_qMS_R99-';\nconst TABLE        = 'projects_data';\n\n// Supabase JS client (used for auth)\nconst _supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);\n\n// ─── AUTH STATE ─────────────────────────────────────────\nlet _authUser   = null;  // Supabase user object, or null for local-only\nlet _authMode   = null;  // 'cloud' | 'local'\nlet _authEmail  = '';    // email entered during OTP flow\n\nfunction isCloudUser() { return _authMode === 'cloud' && _authUser !== null; }\n\n// ─── AUTH UI ────────────────────────────────────────────\nfunction showAuthScreen() {\n  document.getElementById('authScreen').classList.add('visible');\n}\nfunction hideAuthScreen() {\n  document.getElementById('authScreen').classList.remove('visible');\n}\nfunction setAuthMsg(msg, type='') {\n  const el = document.getElementById('authMsg');\n  el.textContent = msg;\n  el.className = 'auth-msg ' + type;\n}\n\nasync function authSendOTP() {\n  const email = document.getElementById('authEmail').value.trim();\n  if (!email || !email.includes('@')) { setAuthMsg('Enter a valid email address.', 'err'); return; }\n  _authEmail = email;\n  const btn = document.getElementById('authSendBtn');\n  btn.disabled = true;\n  setAuthMsg('Sending…');\n  try {\n    const { error } = await _supa.auth.signInWithOtp({\n      email,\n      options: {\n        shouldCreateUser: true,\n        emailRedirectTo: window.location.origin + window.location.pathname\n      }\n    });\n    if (error) throw error;\n    document.getElementById('authEmailStep').style.display = 'none';\n    document.getElementById('authOTPStep').classList.add('visible');\n    document.getElementById('authOTPHint').textContent =\n      `A sign-in link was sent to ${email}. Open it on this device to continue — it will sign you in automatically.`;\n    setAuthMsg('');\n  } catch(e) {\n    setAuthMsg(e.message || 'Could not send sign-in link. Try again.', 'err');\n    btn.disabled = false;\n  }\n}\n\nfunction authBackToEmail() {\n  document.getElementById('authEmailStep').style.display = 'block';\n  document.getElementById('authOTPStep').classList.remove('visible');\n  document.getElementById('authOTP').value = '';\n  setAuthMsg('');\n  document.getElementById('authSendBtn').disabled = false;\n}\n\nfunction authContinueLocal() {\n  _authMode = 'local';\n  _authUser = null;\n  lsSet('proj_auth_mode', 'local');\n  hideAuthScreen();\n  updateUserChip();\n  initApp();\n}\n\nasync function onAuthSuccess() {\n  lsSet('proj_auth_mode', 'cloud');\n  hideAuthScreen();\n  updateUserChip();\n  await initApp();\n}\n\nfunction updateUserChip() {\n  const btn = document.getElementById('settingsBtn');\n  if (!btn) return;\n  if (isCloudUser()) {\n    btn.title = `Settings & Account (${_authUser.email})`;\n    btn.style.color = 'var(--accent2)'; // green tint when signed in\n  } else {\n    btn.title = 'Settings & Account';\n    btn.style.color = '';\n  }\n}\n\nfunction showUserMenu() {\n  openBackupSheet();\n}\n\nasync function authSignOut() {\n  await _supa.auth.signOut();\n  _authUser = null;\n  _authMode = null;\n  lsSet('proj_auth_mode', null);\n  updateUserChip();\n  // Clear local caches so next user starts fresh\n  if (dbReady)  await idbSet(DB_KEY, null);\n  if (lsReady)  lsSet(LS_KEY, null);\n  state = defaultState();\n  render();\n  showAuthScreen();\n}\n\n// ─── SUPABASE REST (auth-aware) ──────────────────────────\nasync function sbFetch(path, options = {}) {\n  const token = await getAuthToken();\n  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {\n    ...options,\n    headers: {\n      'apikey':        SUPABASE_KEY,\n      'Authorization': `Bearer ${token}`,\n      'Content-Type':  'application/json',\n      'Prefer':        options.prefer || '',\n      ...(options.headers || {})\n    }\n  });\n  if (!res.ok) {\n    const err = await res.text();\n    throw new Error(`Supabase ${res.status}: ${err}`);\n  }\n  const text = await res.text();\n  return text ? JSON.parse(text) : null;\n}\n\nasync function supabaseLoad() {\n  if (!isCloudUser()) return null;\n  const userId = _authUser.id;\n  const rows = await sbFetch(`${TABLE}?user_id=eq.${userId}&select=data,updated_at`);\n  if (rows && rows.length > 0) {\n    const data = rows[0].data;\n    const remoteTs = rows[0].updated_at || null;\n    const parsed = typeof data === 'string' ? JSON.parse(data) : data;\n    if (parsed) parsed._remoteTs = remoteTs;\n    return parsed;\n  }\n  // No row for this user — they are new, return null so app starts fresh\n  return null;\n}\n\nasync function supabaseSave(stateObj) {\n  if (!isCloudUser()) return;\n  const userId = _authUser.id;\n  const payload = {\n    data:       stateObj,\n    updated_at: new Date().toISOString()\n  };\n\n  // Try PATCH first — updates the existing row for this user\n  const patchRes = await fetch(\n    `${SUPABASE_URL}/rest/v1/${TABLE}?user_id=eq.${userId}`,\n    {\n      method:  'PATCH',\n      headers: {\n        'apikey':        SUPABASE_KEY,\n        'Authorization': `Bearer ${await getAuthToken()}`,\n        'Content-Type':  'application/json',\n        'Prefer':        'return=minimal,count=exact'\n      },\n      body: JSON.stringify(payload)\n    }\n  );\n  if (!patchRes.ok) {\n    const err = await patchRes.text();\n    throw new Error(`Supabase PATCH ${patchRes.status}: ${err}`);\n  }\n\n  // Check if the PATCH actually matched a row\n  const count = patchRes.headers.get('content-range');\n  const matched = count && !count.startsWith('*/0') && count !== '*/0';\n\n  if (!matched) {\n    // No existing row — INSERT a new one\n    const insertRes = await fetch(\n      `${SUPABASE_URL}/rest/v1/${TABLE}`,\n      {\n        method:  'POST',\n        headers: {\n          'apikey':        SUPABASE_KEY,\n          'Authorization': `Bearer ${await getAuthToken()}`,\n          'Content-Type':  'application/json',\n          'Prefer':        'return=minimal'\n        },\n        body: JSON.stringify({ user_id: userId, ...payload })\n      }\n    );\n    if (!insertRes.ok) {\n      const err = await insertRes.text();\n      throw new Error(`Supabase INSERT ${insertRes.status}: ${err}`);\n    }\n  }\n}\n\nasync function getAuthToken() {\n  const { data: { session } } = await _supa.auth.getSession();\n  return session?.access_token || SUPABASE_KEY;\n}\n\n// ─── CONSTANTS ──────────────────────────────────────────\nconst COLORS = [\n  { id:'red',    hex:'#c84b31' },\n  { id:'green',  hex:'#2d6a4f' },\n  { id:'gold',   hex:'#e9a825' },\n  { id:'blue',   hex:'#2980b9' },\n  { id:'purple', hex:'#8e44ad' },\n  { id:'teal',   hex:'#16a085' },\n  { id:'orange', hex:'#e67e22' },\n  { id:'pink',   hex:'#e91e8c' },\n];\n\nconst PRIORITIES = [\n  { val: 1, label: 'Critical', short: '🔥 Critical' },\n  { val: 2, label: 'High',     short: '⬆ High'     },\n  { val: 3, label: 'Medium',   short: '◆ Medium'   },\n  { val: 4, label: 'Low',      short: '⬇ Low'      },\n  { val: 5, label: 'Someday',  short: '○ Someday'  },\n];\n\nconst DB_NAME  = 'proj_dash_db';\nconst DB_STORE = 'kv';\nconst DB_KEY   = 'state_v2';\nconst LS_KEY   = 'proj_dash_v2';\n\n// ─── STATE ──────────────────────────────────────────────\nlet state = defaultState();\nlet editingProjectId = null;\nlet editingTabId = null;\nlet showArchived = false;\nlet showShelved = false;\nlet selectedColor = 'blue';\nlet selectedTabColor = 'teal';\nlet editTabColorVal = 'teal';\nlet selectedPriority = 3;\nlet sortModes = {};\nfunction getSortMode() { return sortModes[state.activeTab] || 'manual'; }\nlet dbReady = false;\nlet lsReady = false;\n\nfunction defaultState() {\n  return {\n    activeTab: 'general',\n    tabs: [ { id: 'general', name: 'General', color: 'blue' } ],\n    projects: []\n  };\n}\n\nfunction uid() {\n  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);\n}\n\n// ─── INDEXEDDB ──────────────────────────────────────────\nlet _db = null;\n\nfunction openDB() {\n  return new Promise((resolve, reject) => {\n    if (_db) { resolve(_db); return; }\n    const req = indexedDB.open(DB_NAME, 1);\n    req.onupgradeneeded = e => { e.target.result.createObjectStore(DB_STORE); };\n    req.onsuccess = e => { _db = e.target.result; resolve(_db); };\n    req.onerror   = () => reject(req.error);\n  });\n}\n\nasync function idbGet(key) {\n  try {\n    const db = await openDB();\n    return new Promise((resolve, reject) => {\n      const tx = db.transaction(DB_STORE, 'readonly');\n      const req = tx.objectStore(DB_STORE).get(key);\n      req.onsuccess = () => resolve(req.result);\n      req.onerror   = () => reject(req.error);\n    });\n  } catch(e) { return undefined; }\n}\n\nasync function idbSet(key, value) {\n  try {\n    const db = await openDB();\n    return new Promise((resolve, reject) => {\n      const tx = db.transaction(DB_STORE, 'readwrite');\n      const req = tx.objectStore(DB_STORE).put(value, key);\n      req.onsuccess = () => resolve(true);\n      req.onerror   = () => reject(req.error);\n    });\n  } catch(e) { return false; }\n}\n\n// ─── LOCALSTORAGE ───────────────────────────────────────\nfunction lsGet(key) {\n  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : undefined; }\n  catch(e) { return undefined; }\n}\nfunction lsSet(key, value) {\n  try { localStorage.setItem(key, JSON.stringify(value)); return true; }\n  catch(e) { return false; }\n}\nfunction lsAvailable() {\n  try { localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); return true; }\n  catch(e) { return false; }\n}\n\n// ─── CONNECTIVITY ───────────────────────────────────────\n// Tracks actual reachability — badge only goes green when Supabase responds\nlet _isOnline = false;\nlet _connectivityTimer = null;\n\nasync function checkConnectivity() {\n  try {\n    const res = await fetch(\n      `${SUPABASE_URL}/rest/v1/${TABLE}?select=updated_at&limit=1`,\n      {\n        method: 'GET',\n        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },\n        signal: AbortSignal.timeout(6000)\n      }\n    );\n    _isOnline = res.ok;\n  } catch(e) {\n    _isOnline = false;\n  }\n  updateStorageBadge(_isOnline ? (_pendingSave ? 'pending' : (isCloudUser() ? 'ok' : 'local')) : 'offline');\n  return _isOnline;\n}\n\n// Poll connectivity every 30s so badge stays accurate\nfunction startConnectivityPolling() {\n  checkConnectivity();\n  _connectivityTimer = setInterval(checkConnectivity, 30000);\n}\n\n// ─── PER-PROJECT TIMESTAMPS ─────────────────────────────\n// Each project gets a _ts field (ISO string) on every edit.\n// Merge strategy: for each project, keep whichever copy has the newer _ts.\n// Tabs and sort prefs use a simple whole-state _tabTs for comparison.\n\nfunction stampProject(p) {\n  p._ts = new Date().toISOString();\n  return p;\n}\n\nfunction migrateState(s) {\n  // One-time migration: stamp any project missing _ts with epoch so remote always wins\n  if (!s || !s.projects) return s;\n  s.projects = s.projects.map(p => {\n    if (!p._ts) p._ts = '2000-01-01T00:00:00.000Z';\n    if (!p.status) p.status = p.archived ? 'archived' : 'active';\n    return p;\n  });\n  return s;\n}\n\nfunction mergeStates(local, remote, preferRemote = false) {\n  // Returns a merged state containing the best of both\n  if (!local || !local.projects) return remote;\n  if (!remote || !remote.projects) return local;\n\n  // Merge projects: per-project, keep whichever _ts is newer\n  const remoteMap = new Map(remote.projects.map(p => [p.id, p]));\n  const localMap  = new Map(local.projects.map(p => [p.id, p]));\n  const allIds    = new Set([...remoteMap.keys(), ...localMap.keys()]);\n\n  const merged = [];\n  allIds.forEach(id => {\n    const r = remoteMap.get(id);\n    const l = localMap.get(id);\n    if (!r) { merged.push(l); return; } // only local — keep it\n    if (!l) { merged.push(r); return; } // only remote — keep it\n    // Both exist — keep newer; on ties, preferRemote decides (manual refresh = remote wins)\n    const rTime = r._ts ? new Date(r._ts).getTime() : 0;\n    const lTime = l._ts ? new Date(l._ts).getTime() : 0;\n    if (rTime === lTime) merged.push(preferRemote ? r : l);\n    else                 merged.push(lTime > rTime ? l : r);\n  });\n\n  // For tabs and sort prefs, use whichever state is newer overall\n  const remoteTabTs = remote._tabTs ? new Date(remote._tabTs).getTime() : 0;\n  const localTabTs  = local._tabTs  ? new Date(local._tabTs).getTime()  : 0;\n  let winner;\n  if (remoteTabTs === localTabTs) winner = preferRemote ? remote : local;\n  else                            winner = localTabTs > remoteTabTs ? local : remote;\n\n  return {\n    ...winner,\n    projects:     merged,\n    tabSortModes: winner.tabSortModes || {},\n    _tabTs:       winner._tabTs || new Date().toISOString(),\n  };\n}\n\n// ─── SAVE / LOAD ────────────────────────────────────────\nlet saveTimer      = null;\nlet _pendingSave   = false; // local changes not yet confirmed written to Supabase\n\nasync function saveState() {\n  // Update local caches immediately\n  if (lsReady) lsSet(LS_KEY, state);\n  if (dbReady) await idbSet(DB_KEY, JSON.stringify(state));\n  _pendingSave = true;\n\n  if (!isCloudUser()) {\n    updateStorageBadge('local');\n    _pendingSave = false;\n    return;\n  }\n\n  updateStorageBadge(_isOnline ? 'pending' : 'offline');\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(flushToSupabase, 1200);\n}\n\nasync function flushToSupabase() {\n  if (!isCloudUser()) {\n    _pendingSave = false;\n    updateStorageBadge('local');\n    return;\n  }\n  if (!_isOnline) {\n    const online = await checkConnectivity();\n    if (!online) {\n      _saveRetryTimer = setTimeout(flushToSupabase, 10000);\n      return;\n    }\n  }\n  try {\n    const remote = await supabaseLoad();\n    let toSave = state;\n    if (remote && remote.projects) {\n      toSave = mergeStates(state, remote);\n      state  = toSave;\n      if (state.tabSortModes) sortModes = state.tabSortModes;\n      if (lsReady) lsSet(LS_KEY, state);\n      if (dbReady) await idbSet(DB_KEY, JSON.stringify(state));\n    }\n    await supabaseSave(toSave);\n    _pendingSave = false;\n    updateStorageBadge('ok');\n  } catch(e) {\n    console.warn('Supabase write failed, will retry:', e);\n    updateStorageBadge(_isOnline ? 'err' : 'offline');\n    _saveRetryTimer = setTimeout(flushToSupabase, 15000);\n  }\n}\nlet _saveRetryTimer = null;\n\nasync function loadPersistedState() {\n  // Step 1: load local cache first so UI is instant\n  let localState = null;\n  if (dbReady) {\n    try {\n      const raw = await idbGet(DB_KEY);\n      if (raw) {\n        const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;\n        if (parsed && parsed.tabs) localState = migrateState(parsed);\n      }\n    } catch(e) {}\n  }\n  if (!localState && lsReady) {\n    try {\n      const parsed = lsGet(LS_KEY);\n      if (parsed && parsed.tabs) localState = migrateState(parsed);\n    } catch(e) {}\n  }\n\n  if (localState) {\n    state = localState;\n    if (state.tabSortModes) sortModes = state.tabSortModes;\n  }\n\n  // Local-only users — stop here, no Supabase\n  if (!isCloudUser()) {\n    if (!localState) state = defaultState();\n    updateStorageBadge('local');\n    return;\n  }\n\n  // Step 2: check connectivity\n  const online = await checkConnectivity();\n  if (!online) {\n    if (!localState) state = defaultState();\n    updateStorageBadge('offline');\n    showOfflineBanner();\n    return;\n  }\n\n  // Step 3: fetch remote and merge\n  try {\n    const remote = await supabaseLoad();\n    if (remote && remote.tabs) {\n      const migratedRemote = migrateState(remote);\n      if (localState) {\n        state = mergeStates(localState, migratedRemote);\n      } else {\n        state = migratedRemote;\n      }\n      if (state.tabSortModes) sortModes = state.tabSortModes;\n      if (lsReady) lsSet(LS_KEY, state);\n      if (dbReady) await idbSet(DB_KEY, JSON.stringify(state));\n      if (localState) await supabaseSave(state);\n      updateStorageBadge('ok');\n      const ob = document.getElementById('offlineBanner');\n      if (ob) ob.style.display = 'none';\n    } else if (!localState) {\n      // New cloud user with no data yet\n      state = defaultState();\n      updateStorageBadge('ok');\n    }\n  } catch(e) {\n    console.warn('Supabase load failed:', e);\n    updateStorageBadge('err');\n  }\n}\n\nasync function forceRefresh() {\n  if (!isCloudUser()) {\n    updateStorageBadge('local');\n    return;\n  }\n  updateStorageBadge('syncing');\n  const online = await checkConnectivity();\n  if (!online) {\n    updateStorageBadge('offline');\n    showOfflineBanner();\n    return;\n  }\n  try {\n    const remote = await supabaseLoad();\n    if (remote && remote.tabs) {\n      const migratedRemote = migrateState(remote);\n      state = mergeStates(state, migratedRemote, true);  // manual refresh: remote wins ties\n      if (state.tabSortModes) sortModes = state.tabSortModes;\n      if (lsReady) lsSet(LS_KEY, state);\n      if (dbReady) await idbSet(DB_KEY, JSON.stringify(state));\n      await supabaseSave(state);\n      updateStorageBadge('ok');\n      hideConflictBanner();\n      const ob = document.getElementById('offlineBanner');\n      if (ob) ob.style.display = 'none';\n      render();\n    }\n  } catch(e) {\n    updateStorageBadge('err');\n  }\n}\n\nfunction showConflictBanner() {\n  // Conflict banner no longer needed — merge handles it automatically\n  // Kept as a no-op for safety\n}\n\nfunction hideConflictBanner() {\n  const b = document.getElementById('conflictBanner');\n  if (b) b.style.display = 'none';\n}\n\nfunction showOfflineBanner() {\n  let b = document.getElementById('offlineBanner');\n  if (!b) {\n    b = document.createElement('div');\n    b.id = 'offlineBanner';\n    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#3a2a0a;color:#e9a825;padding:10px 18px;font-family:\\'DM Mono\\',monospace;font-size:11px;letter-spacing:0.08em;display:flex;align-items:center;justify-content:space-between;gap:12px;';\n    b.innerHTML = '<span>⚠ No internet — working from cache. Changes will sync automatically when reconnected.<\u002Fspan>'\n      + '<button onclick=\"forceRefresh()\" style=\"background:rgba(255,255,255,0.1);color:#e9a825;border:1px solid rgba(233,168,37,0.4);border-radius:6px;padding:6px 12px;font-family:\\'DM Mono\\',monospace;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em\">Retry<\u002Fbutton>';\n    document.body.appendChild(b);\n  }\n  b.style.display = 'flex';\n}\n\nfunction updateStorageBadge(status) {\n  const badge = document.getElementById('storageBadge');\n  if (!badge) return;\n  const map = {\n    ok:      { text: '● Synced',      cls: 'ok'   },\n    syncing: { text: '↻ Syncing',     cls: 'warn' },\n    pending: { text: '↑ Saving',      cls: 'warn' },\n    offline: { text: '◌ Offline',     cls: 'warn' },\n    local:   { text: '◌ Local only',  cls: 'warn' },\n    err:     { text: '✕ Error',       cls: 'err'  },\n  };\n  const s = map[status] || map.offline;\n  badge.textContent = s.text;\n  badge.className = 'storage-badge ' + s.cls;\n}\n\n// ─── EXPORT / IMPORT ────────────────────────────────────\nfunction exportBackup() {\n  const json = JSON.stringify(state, null, 2);\n  const blob = new Blob([json], { type: 'application/json' });\n  const url  = URL.createObjectURL(blob);\n  const a    = document.createElement('a');\n  const date = new Date().toISOString().slice(0,10);\n  a.href = url; a.download = `projects-backup-${date}.json`;\n  document.body.appendChild(a); a.click();\n  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);\n}\n\nfunction importBackup(event) {\n  const file = event.target.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = async (e) => {\n    try {\n      const parsed = JSON.parse(e.target.result);\n      if (!parsed.tabs || !Array.isArray(parsed.projects)) { alert('Invalid backup file.'); return; }\n      if (!confirm(`Import backup? This replaces current data with ${parsed.projects.length} project(s) across ${parsed.tabs.length} tab(s).`)) return;\n      state = parsed;\n      await saveState();\n      render();\n      closeSheet('backupOverlay');\n    } catch(err) { alert('Could not read backup file: ' + err.message); }\n  };\n  reader.readAsText(file);\n  event.target.value = '';\n}\n\nfunction openBackupSheet() {\n  const statusEl = document.getElementById('backupStatusText');\n  if (statusEl) {\n    if (isCloudUser()) {\n      const badge = document.getElementById('storageBadge');\n      const synced = badge && badge.classList.contains('ok');\n      statusEl.textContent = (synced ? '✓ Synced — ' : '⚠ Unsynced — ')\n        + (_authUser.email || 'signed in')\n        + (dbReady ? ' + IndexedDB cache' : '')\n        + (lsReady ? ' + localStorage cache' : '');\n    } else {\n      statusEl.textContent = '◌ Local only — data stored on this device only';\n    }\n  }\n  const signedEl = document.getElementById('backupAuthSigned');\n  const localEl  = document.getElementById('backupAuthLocal');\n  const emailEl  = document.getElementById('backupAuthEmail');\n  if (isCloudUser()) {\n    if (signedEl) signedEl.style.display = 'block';\n    if (localEl)  localEl.style.display  = 'none';\n    if (emailEl)  emailEl.textContent    = _authUser.email || '';\n  } else {\n    if (signedEl) signedEl.style.display = 'none';\n    if (localEl)  localEl.style.display  = 'block';\n  }\n  document.getElementById('backupOverlay').classList.add('open');\n}\n\nfunction backupSheetSignIn() {\n  // Clear local-only preference and show auth screen\n  lsSet('proj_auth_mode', null);\n  _authMode = null;\n  closeSheet('backupOverlay');\n  showAuthScreen();\n}\n\n// ─── DATE UTILS ─────────────────────────────────────────\nfunction formatDateDisplay(iso) {\n  if (!iso) return null;\n  const [y,m,d] = iso.split('-');\n  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n  return `${months[+m-1]} ${+d}, ${y}`;\n}\n\nfunction isOverdue(iso) {\n  if (!iso) return false;\n  return new Date(iso) < new Date(new Date().toDateString());\n}\n\nfunction isFuture(iso) {\n  if (!iso) return false;\n  return new Date(iso) > new Date(new Date().toDateString());\n}\n\n// ─── RESPONSIVE ─────────────────────────────────────────\nfunction isDesktop() { return window.innerWidth >= 900; }\n\nfunction render() {\n  if (isDesktop()) { renderKanban(); }\n  else { renderTabs(); renderContent(); }\n}\n\nlet _lastDesktop = isDesktop();\nwindow.addEventListener('resize', () => {\n  const nowDesktop = isDesktop();\n  if (nowDesktop !== _lastDesktop) { _lastDesktop = nowDesktop; render(); }\n});\n\n// ─── KANBAN ─────────────────────────────────────────────\nfunction renderKanban() {\n  const board = document.getElementById('kanbanBoard');\n  if (!board) return;\n  board.style.display = 'flex';\n  document.getElementById('mainContent').style.display = 'none';\n  document.querySelector('.tabs-wrapper').style.display = 'none';\n\n  let html = '';\n\n  state.tabs.forEach(tab => {\n    const sm = sortModes[tab.id] || 'manual';\n    let active   = state.projects.filter(p => p.tabId === tab.id && p.status === 'active');\n    let shelved  = state.projects.filter(p => p.tabId === tab.id && p.status === 'shelved');\n    let archived = state.projects.filter(p => p.tabId === tab.id && p.status === 'archived');\n\n    function srt(arr) {\n      if (sm === 'priority')      return [...arr].sort((a,b) => (a.priority||3)-(b.priority||3));\n      if (sm === 'deadline')      return [...arr].sort((a,b) => { if(!a.deadline&&!b.deadline)return 0; if(!a.deadline)return 1; if(!b.deadline)return -1; return new Date(a.deadline)-new Date(b.deadline); });\n      if (sm === 'deadline-desc') return [...arr].sort((a,b) => { if(!a.deadline&&!b.deadline)return 0; if(!a.deadline)return 1; if(!b.deadline)return -1; return new Date(b.deadline)-new Date(a.deadline); });\n      if (sm === 'start')         return [...arr].sort((a,b) => { if(!a.start&&!b.start)return 0; if(!a.start)return 1; if(!b.start)return -1; return new Date(a.start)-new Date(b.start); });\n      if (sm === 'start-desc')    return [...arr].sort((a,b) => { if(!a.start&&!b.start)return 0; if(!a.start)return 1; if(!b.start)return -1; return new Date(b.start)-new Date(a.start); });\n      return arr;\n    }\n    active = srt(active); shelved = srt(shelved); archived = srt(archived);\n\n    const done = active.filter(p => p.progress === 100).length;\n    const overdue = active.filter(p => p.deadline && isOverdue(p.deadline) && p.progress < 100).length;\n    const shelvedCount = shelved.length;\n    const archivedCount = archived.length;\n    const editBtn = tab.id !== 'general'\n      ? `<button class=\"kanban-edit-btn\" onclick=\"openEditTab('${tab.id}')\">✎<\u002Fbutton>` : '';\n\n    let cards = '';\n    if (active.length === 0 && !showShelved && !showArchived) {\n      cards = `<div class=\"empty\" style=\"padding:36px 10px\">\n        <svg class=\"empty-graphic\" viewBox=\"0 0 72 72\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n          <rect x=\"12\" y=\"16\" width=\"48\" height=\"44\" rx=\"6\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n          <rect x=\"24\" y=\"10\" width=\"24\" height=\"12\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n          <line x1=\"22\" y1=\"34\" x2=\"50\" y2=\"34\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n          <line x1=\"22\" y1=\"44\" x2=\"42\" y2=\"44\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <\u002Fsvg>\n        <div class=\"empty-title\">Nothing here yet<\u002Fdiv>\n        <div class=\"empty-sub\">Tap <strong>+<\u002Fstrong> below to add your first project<\u002Fdiv>\n      <\u002Fdiv>`;\n    } else {\n      if (active.length > 0) { cards += `<div class=\"section-label\">Active<\u002Fdiv>`; active.forEach((p,i) => { cards += renderCard(p,i); }); }\n      if (shelved.length > 0) { cards += sectionHeaderHtml('Shelved', shelved.length, showShelved, 'toggleShelvedView', 'shelved-label'); if (showShelved) shelved.forEach((p,i) => { cards += renderCard(p,i); }); }\n      if (archived.length > 0) { cards += sectionHeaderHtml('Archived', archived.length, showArchived, 'toggleArchiveView'); if (showArchived) archived.forEach((p,i) => { cards += renderCard(p,i); }); }\n    }\n\n    const stats = (active.length > 0 || shelvedCount > 0 || archivedCount > 0) ? `<div class=\"kanban-stats\">\n      <div class=\"stat-chip\"><span class=\"stat-num\">${active.length}<\u002Fspan><span class=\"stat-lbl\">Active<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-chip${overdue>0?' overdue':''}\"><span class=\"stat-num\">${overdue}<\u002Fspan><span class=\"stat-lbl\">Overdue<\u002Fspan><\u002Fdiv>\n      ${shelvedCount>0?`<div class=\"stat-chip shelved\"><span class=\"stat-num\">${shelvedCount}<\u002Fspan><span class=\"stat-lbl\">Shelved<\u002Fspan><\u002Fdiv>`:''}\n      ${archivedCount>0?`<div class=\"stat-chip archived\"><span class=\"stat-num\">${archivedCount}<\u002Fspan><span class=\"stat-lbl\">Archived<\u002Fspan><\u002Fdiv>`:''}\n    <\u002Fdiv>` : '';\n\n    html += `<div class=\"kanban-col\" id=\"kcol-${tab.id}\"\n      ondragover=\"kanbanDragOver(event)\"\n      ondrop=\"kanbanDrop(event,'${tab.id}')\"\n      ondragend=\"kanbanDragEnd(event)\">\n      <div class=\"kanban-col-header\"\n        draggable=\"true\"\n        ondragstart=\"kanbanDragStart(event,'${tab.id}')\">\n        <div class=\"kanban-col-title\"><span class=\"tab-dot tab-dot-${tab.color}\"><\u002Fspan>${escHtml(tab.name)}<\u002Fdiv>\n        <div class=\"kanban-col-meta\"><span class=\"kanban-col-count\">${active.length} project${active.length!==1?'s':''}<\u002Fspan>${editBtn}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kanban-sort-bar\">\n        <span class=\"sort-lbl\">Sort:<\u002Fspan>\n        <button class=\"sort-btn ${sm==='manual'?'active':''}\"           onclick=\"setKanbanSort('${tab.id}','manual')\">Default<\u002Fbutton>\n        <button class=\"sort-btn ${sm==='priority'?'active':''}\"         onclick=\"setKanbanSort('${tab.id}','priority')\">Priority<\u002Fbutton>\n        <button class=\"sort-btn ${sm==='deadline'?'active':''}\"         onclick=\"setKanbanSort('${tab.id}','deadline')\">Due ↑<\u002Fbutton>\n        <button class=\"sort-btn ${sm==='deadline-desc'?'active':''}\"    onclick=\"setKanbanSort('${tab.id}','deadline-desc')\">Due ↓<\u002Fbutton>\n        <button class=\"sort-btn ${sm==='start'?'active':''}\"            onclick=\"setKanbanSort('${tab.id}','start')\">Start ↑<\u002Fbutton>\n        <button class=\"sort-btn ${sm==='start-desc'?'active':''}\"       onclick=\"setKanbanSort('${tab.id}','start-desc')\">Start ↓<\u002Fbutton>\n      <\u002Fdiv>\n      ${stats}\n      <div class=\"kanban-cards\" id=\"kcards-${tab.id}\">${cards}<\u002Fdiv>\n      <button class=\"kanban-add-btn\" onclick=\"openAddProjectForTab('${tab.id}')\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><\u002Fsvg>\n        Add Project\n      <\u002Fbutton>\n    <\u002Fdiv>`;\n  });\n\n  html += `<div class=\"kanban-new-col\" onclick=\"openNewTabSheet()\"><div class=\"kanban-new-col-icon\">＋<\u002Fdiv><div>New List<\u002Fdiv><\u002Fdiv>`;\n  board.innerHTML = html;\n\n  board.querySelectorAll('.prog-slider').forEach(slider => {\n    slider.addEventListener('input', function() {\n      const fill = document.getElementById('fill-'+this.dataset.id);\n      const pct  = document.getElementById('pct-'+this.dataset.id);\n      if (fill) fill.style.setProperty('--w', this.value + '%');\n      if (pct)  pct.textContent  = this.value + '%';\n    });\n    slider.addEventListener('change', function() {\n      const p = state.projects.find(x => x.id === this.dataset.id);\n      if (p) { p.progress = +this.value; stampProject(p); saveState(); renderKanban(); }\n    });\n  });\n\n  // Attach checkbox listeners for every kanban card with a description\n  state.projects.filter(p => p.desc).forEach(p => {\n    const body   = document.getElementById('body-' + p.id);\n    const descEl = body ? body.querySelector('.card-desc.md-body') : null;\n    if (descEl) attachCheckboxListeners(descEl, p.id);\n  });\n}\n\nfunction setKanbanSort(tabId, mode) {\n  sortModes[tabId] = mode;\n  state.tabSortModes = sortModes;\n  saveState(); renderKanban();\n}\n\nfunction openAddProjectForTab(tabId) {\n  openAddProject();\n  setTimeout(() => { const sel = document.getElementById('projTab'); if (sel) sel.value = tabId; }, 50);\n}\n\n// ─── MOBILE RENDER ──────────────────────────────────────\nlet _dragSrcIdx = null;\n\nfunction renderTabs() {\n  if (isDesktop()) return;\n  const scroll = document.getElementById('tabsScroll');\n  const addBtn = scroll.querySelector('.tab-add');\n  scroll.innerHTML = '';\n\n  state.tabs.forEach((tab, idx) => {\n    const active = tab.id === state.activeTab;\n    const count  = state.projects.filter(p => p.tabId === tab.id && p.status === 'active').length;\n    const btn    = document.createElement('button');\n    btn.className   = 'tab' + (active ? ' active' : '');\n    btn.dataset.idx = idx;\n    btn.draggable   = true;\n\n    // Drag handle (⠿ dots icon)\n    const handle = document.createElement('span');\n    handle.className   = 'tab-drag-handle';\n    handle.textContent = '⠿';\n    handle.title       = 'Drag to reorder';\n    btn.appendChild(handle);\n\n    // Dot + name + count\n    const dot = document.createElement('span');\n    dot.className = `tab-dot tab-dot-${tab.color}`;\n    btn.appendChild(dot);\n    btn.appendChild(document.createTextNode(tab.name));\n    const countEl = document.createElement('span');\n    countEl.className   = 'tab-count';\n    countEl.textContent = count;\n    btn.appendChild(countEl);\n\n    // Edit icon for non-general lists\n    if (tab.id !== 'general') {\n      const ei = document.createElement('span');\n      ei.className   = 'tab-edit-icon';\n      ei.textContent = '✎';\n      ei.onclick = (e) => { e.stopPropagation(); openEditTab(tab.id); };\n      btn.appendChild(ei);\n    }\n\n    // Click to switch\n    btn.onclick = (e) => {\n      if (e.target.classList.contains('tab-drag-handle') ||\n          e.target.classList.contains('tab-edit-icon')) return;\n      state.activeTab = tab.id; saveState(); render();\n    };\n\n    // Drag events\n    btn.addEventListener('dragstart', (e) => {\n      _dragSrcIdx = idx;\n      btn.classList.add('dragging');\n      e.dataTransfer.effectAllowed = 'move';\n    });\n    btn.addEventListener('dragend', () => {\n      btn.classList.remove('dragging');\n      document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over'));\n    });\n    btn.addEventListener('dragover', (e) => {\n      e.preventDefault();\n      e.dataTransfer.dropEffect = 'move';\n      document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over'));\n      btn.classList.add('drag-over');\n    });\n    btn.addEventListener('drop', (e) => {\n      e.preventDefault();\n      const toIdx = +btn.dataset.idx;\n      if (_dragSrcIdx === null || _dragSrcIdx === toIdx) return;\n      const tabs = [...state.tabs];\n      const [moved] = tabs.splice(_dragSrcIdx, 1);\n      tabs.splice(toIdx, 0, moved);\n      state.tabs = tabs;\n      _dragSrcIdx = null;\n      saveState();\n      render();\n    });\n\n    scroll.insertBefore(btn, null);\n  });\n\n  scroll.appendChild(addBtn);\n  scrollActiveTabIntoView();\n}\n\n// Scroll the horizontal tab strip so the active tab is centered (or as close as possible).\n// Called after every tab re-render so the bar follows swipe-driven list changes.\nfunction scrollActiveTabIntoView(smooth = true) {\n  const scroll = document.getElementById('tabsScroll');\n  if (!scroll) return;\n  const active = scroll.querySelector('.tab.active');\n  if (!active) return;\n  const scrollRect = scroll.getBoundingClientRect();\n  const activeRect = active.getBoundingClientRect();\n  // Target: center the active tab within the visible scroll area\n  const currentScroll = scroll.scrollLeft;\n  const activeCenter  = (activeRect.left - scrollRect.left) + activeRect.width / 2;\n  const targetScroll  = currentScroll + activeCenter - scrollRect.width / 2;\n  const clamped       = Math.max(0, Math.min(targetScroll, scroll.scrollWidth - scroll.clientWidth));\n  if (smooth && 'scrollTo' in scroll) {\n    scroll.scrollTo({ left: clamped, behavior: 'smooth' });\n  } else {\n    scroll.scrollLeft = clamped;\n  }\n}\n\nfunction renderContent() {\n  if (isDesktop()) return;\n  const el = document.getElementById('mainContent');\n  // Only reset display styles if not currently mid-swipe animation\n  if (el && !el.classList.contains('swipe-out-left') &&\n            !el.classList.contains('swipe-out-right') &&\n            !el.classList.contains('swipe-in-left') &&\n            !el.classList.contains('swipe-in-right')) {\n    el.style.display = '';\n  }\n  document.getElementById('kanbanBoard').style.display = 'none';\n  document.querySelector('.tabs-wrapper').style.display = '';\n  const tab = state.tabs.find(t => t.id === state.activeTab);\n  if (!tab) return;\n\n  const sm = getSortMode();\n  function srt(arr) {\n    if (sm === 'priority')      return [...arr].sort((a,b) => (a.priority||3)-(b.priority||3));\n    if (sm === 'deadline')      return [...arr].sort((a,b) => { if(!a.deadline&&!b.deadline)return 0; if(!a.deadline)return 1; if(!b.deadline)return -1; return new Date(a.deadline)-new Date(b.deadline); });\n    if (sm === 'deadline-desc') return [...arr].sort((a,b) => { if(!a.deadline&&!b.deadline)return 0; if(!a.deadline)return 1; if(!b.deadline)return -1; return new Date(b.deadline)-new Date(a.deadline); });\n    if (sm === 'start')         return [...arr].sort((a,b) => { if(!a.start&&!b.start)return 0; if(!a.start)return 1; if(!b.start)return -1; return new Date(a.start)-new Date(b.start); });\n    if (sm === 'start-desc')    return [...arr].sort((a,b) => { if(!a.start&&!b.start)return 0; if(!a.start)return 1; if(!b.start)return -1; return new Date(b.start)-new Date(a.start); });\n    return arr;\n  }\n  let active   = srt(state.projects.filter(p => p.tabId === state.activeTab && p.status === 'active'));\n  let shelved  = srt(state.projects.filter(p => p.tabId === state.activeTab && p.status === 'shelved'));\n  let archived = srt(state.projects.filter(p => p.tabId === state.activeTab && p.status === 'archived'));\n\n  let html = `<div class=\"sort-bar\">\n    <span class=\"sort-lbl\">Sort:<\u002Fspan>\n    <button class=\"sort-btn ${sm==='manual'?'active':''}\"           onclick=\"setSort('manual')\">Default<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='priority'?'active':''}\"         onclick=\"setSort('priority')\">Priority<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='deadline'?'active':''}\"         onclick=\"setSort('deadline')\">Due ↑<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='deadline-desc'?'active':''}\"    onclick=\"setSort('deadline-desc')\">Due ↓<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='start'?'active':''}\"            onclick=\"setSort('start')\">Start ↑<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='start-desc'?'active':''}\"       onclick=\"setSort('start-desc')\">Start ↓<\u002Fbutton>\n  <\u002Fdiv>`;\n\n  if (active.length > 0 || shelved.length > 0 || archived.length > 0) {\n    const done = active.filter(p => p.progress === 100).length;\n    const overdue = active.filter(p => p.deadline && isOverdue(p.deadline) && p.progress < 100).length;\n    const shelvedCount = shelved.length;\n    const archivedCount = archived.length;\n    html += `<div class=\"stats-row\" style=\"margin-top:14px\">\n      <div class=\"stat-chip\"><span class=\"stat-num\">${active.length}<\u002Fspan><span class=\"stat-lbl\">Active<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-chip${overdue>0?' overdue':''}\"><span class=\"stat-num\">${overdue}<\u002Fspan><span class=\"stat-lbl\">Overdue<\u002Fspan><\u002Fdiv>\n      ${shelvedCount>0?`<div class=\"stat-chip shelved\"><span class=\"stat-num\">${shelvedCount}<\u002Fspan><span class=\"stat-lbl\">Shelved<\u002Fspan><\u002Fdiv>`:''}\n      ${archivedCount>0?`<div class=\"stat-chip archived\"><span class=\"stat-num\">${archivedCount}<\u002Fspan><span class=\"stat-lbl\">Archived<\u002Fspan><\u002Fdiv>`:''}\n    <\u002Fdiv>`;\n  }\n\n  if (active.length === 0 && !showShelved && !showArchived) {\n    html += `<div class=\"empty\">\n      <svg class=\"empty-graphic\" viewBox=\"0 0 72 72\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n        <rect x=\"12\" y=\"16\" width=\"48\" height=\"44\" rx=\"6\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n        <rect x=\"24\" y=\"10\" width=\"24\" height=\"12\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n        <line x1=\"22\" y1=\"34\" x2=\"50\" y2=\"34\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <line x1=\"22\" y1=\"44\" x2=\"42\" y2=\"44\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n      <\u002Fsvg>\n      <div class=\"empty-title\">No projects in <em>${escHtml(tab.name)}<\u002Fem><\u002Fdiv>\n      <div class=\"empty-sub\">Tap <strong>+<\u002Fstrong> to add your first project here.<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n  if (active.length > 0)   { html += `<div class=\"section-label\">Active<\u002Fdiv>`; active.forEach((p,i) => { html += renderCard(p,i); }); }\n  if (shelved.length > 0)  { html += sectionHeaderHtml('Shelved', shelved.length, showShelved, 'toggleShelvedView', 'shelved-label'); if (showShelved) shelved.forEach((p,i) => { html += renderCard(p,i); }); }\n  if (archived.length > 0) { html += sectionHeaderHtml('Archived', archived.length, showArchived, 'toggleArchiveView'); if (showArchived) archived.forEach((p,i) => { html += renderCard(p,i); }); }\n\n  document.getElementById('mainContent').innerHTML = html;\n\n  // Attach slider listeners\n  document.querySelectorAll('.prog-slider').forEach(slider => {\n    slider.addEventListener('input', function() {\n      const fill = document.getElementById('fill-'+this.dataset.id);\n      const pct  = document.getElementById('pct-'+this.dataset.id);\n      if (fill) fill.style.setProperty('--w', this.value + '%');\n      if (pct)  pct.textContent  = this.value + '%';\n    });\n    slider.addEventListener('change', function() {\n      const p = state.projects.find(x => x.id === this.dataset.id);\n      if (p) { p.progress = +this.value; stampProject(p); saveState(); renderTabs(); }\n    });\n  });\n\n  // Attach checkbox listeners for every rendered card\n  state.projects.filter(p => p.tabId === state.activeTab && p.desc).forEach(p => {\n    const body   = document.getElementById('body-' + p.id);\n    const descEl = body ? body.querySelector('.card-desc.md-body') : null;\n    if (descEl) attachCheckboxListeners(descEl, p.id);\n  });\n}\n\nfunction setSort(mode) {\n  sortModes[state.activeTab] = mode;\n  state.tabSortModes = sortModes;\n  saveState(); renderContent();\n}\n\n// ─── MARKDOWN ───────────────────────────────────────────\nfunction renderMarkdown(raw, projId) {\n  if (!raw) return '';\n\n  // Work from raw lines for accurate line indexing\n  const rawLines = raw.split('\\n');\n  const out = [];\n  let inUl = false, inOl = false;\n  let calloutType = null, calloutLines = [];\n\n  function closeList() {\n    if (inUl) { out.push('<\u002Ful>'); inUl = false; }\n    if (inOl) { out.push('<\u002Fol>'); inOl = false; }\n  }\n  function flushCallout() {\n    if (calloutType === null) return;\n    const type = calloutType.toLowerCase();\n    const cls  = ['warning','caution','danger'].includes(type) ? 'md-callout-warn'\n                : ['tip','hint','important'].includes(type)    ? 'md-callout-tip'\n                : 'md-callout-note';\n    const icon = ['warning','caution','danger'].includes(type) ? '⚠'\n                : ['tip','hint'].includes(type)                ? '💡'\n                : ['important'].includes(type)                 ? '❗'\n                : 'ℹ';\n    const label = calloutType.charAt(0).toUpperCase() + calloutType.slice(1);\n    out.push(`<div class=\"${cls}\"><div class=\"md-callout-title\">${icon} ${label}<\u002Fdiv><div class=\"md-callout-body\">${calloutLines.join(' ')}<\u002Fdiv><\u002Fdiv>`);\n    calloutType = null;\n    calloutLines = [];\n  }\n\n  rawLines.forEach((rawLine, idx) => {\n    // Escape for safe HTML output\n    const line = rawLine\n      .replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');\n\n    // Obsidian callout opener: > [!type]\n    const calloutOpen = line.match(/^&gt;\\s*\\[!([\\w]+)\\]/i);\n    if (calloutOpen) {\n      closeList(); flushCallout();\n      calloutType = calloutOpen[1];\n      return;\n    }\n    // Continuation of callout\n    if (calloutType !== null && /^&gt;/.test(line)) {\n      calloutLines.push(line.replace(/^&gt;\\s*/, ''));\n      return;\n    }\n    if (calloutType !== null) { flushCallout(); }\n\n    // Checkboxes — use idx (raw line index) as the stable reference\n    const cbMatch = rawLine.match(/^[-*]\\s+\\[([ xX\\/])\\]\\s*(.*)/);\n    if (cbMatch) {\n      closeList();\n      const rawState = cbMatch[1];\n      const label    = escHtml(cbMatch[2]);\n      const st       = rawState === ' ' ? 'open' : rawState.toLowerCase() === 'x' ? 'done' : 'prog';\n      const icon     = st === 'done' ? '✓' : st === 'prog' ? '◑' : '';\n      const cls      = st === 'done' ? 'done' : st === 'prog' ? 'prog' : '';\n      // data-line-idx used by attachCheckboxListeners — no inline onclick\n      out.push(`<div class=\"md-cb ${cls}\" data-line-idx=\"${idx}\" style=\"cursor:pointer\"><span class=\"md-cb-box\">${icon}<\u002Fspan><span class=\"md-cb-label\">${label}<\u002Fspan><\u002Fdiv>`);\n      return;\n    }\n\n    if (/^### (.+)/.test(line))     { closeList(); out.push(`<h4>${line.replace(/^### /,'')}<\u002Fh4>`); return; }\n    if (/^## (.+)/.test(line))      { closeList(); out.push(`<h3>${line.replace(/^## /,'')}<\u002Fh3>`); return; }\n    if (/^# (.+)/.test(line))       { closeList(); out.push(`<h2>${line.replace(/^# /,'')}<\u002Fh2>`); return; }\n    if (/^---+$/.test(line.trim())) { closeList(); out.push('<hr>'); return; }\n    if (/^[-*] (.+)/.test(line))    { if (!inUl) { closeList(); out.push('<ul>'); inUl=true; } out.push(`<li>${line.replace(/^[-*] /,'')}<\u002Fli>`); return; }\n    if (/^\\d+\\. (.+)/.test(line))   { if (!inOl) { closeList(); out.push('<ol>'); inOl=true; } out.push(`<li>${line.replace(/^\\d+\\. /,'')}<\u002Fli>`); return; }\n    if (/^&gt; (.+)/.test(line))    { closeList(); out.push(`<blockquote>${line.replace(/^&gt;\\s*/,'')}<\u002Fblockquote>`); return; }\n    if (line.trim() === '')         { closeList(); out.push('<br>'); return; }\n    closeList(); out.push(`<p>${line}<\u002Fp>`);\n  });\n  closeList(); flushCallout();\n\n  return out.join('')\n    .replace(/==(.+?)==/g,          '<mark>$1<\u002Fmark>')\n    .replace(/\\*\\*\\*(.+?)\\*\\*\\*/g,  '<strong><em>$1<\u002Fem><\u002Fstrong>')\n    .replace(/\\*\\*(.+?)\\*\\*/g,      '<strong>$1<\u002Fstrong>')\n    .replace(/\\*(.+?)\\*/g,          '<em>$1<\u002Fem>')\n    .replace(/_(.+?)_/g,            '<em>$1<\u002Fem>')\n    .replace(/~~(.+?)~~/g,          '<s>$1<\u002Fs>')\n    .replace(/`(.+?)`/g,            '<code>$1<\u002Fcode>')\n    .replace(/\\[(.+?)\\]\\((https?:\\/\\/[^\\)]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1<\u002Fa>');\n}\n\n// ─── RENDER CARD ────────────────────────────────────────\nfunction renderCard(p, idx) {\n  const color  = COLORS.find(c => c.id === p.color) || COLORS[3];\n  // Checkboxes in the description (if any) drive the displayed progress\n  const cp             = computeCheckboxProgress(p.desc);\n  const displayPct     = cp ? cp.progress : p.progress;\n  const checkboxDriven = !!cp;\n  const overdue = p.deadline && isOverdue(p.deadline) && displayPct < 100;\n  const pri    = PRIORITIES.find(x => x.val === (p.priority || 3));\n  const priCls = `pri-${p.priority || 3}`;\n  const stagger = idx !== undefined ? `--card-i:${idx};` : '';\n  return `<div class=\"project-card${p.status==='archived'?' archived':''}${p.status==='shelved'?' shelved':''}${overdue?' overdue':''}\" id=\"card-${p.id}\" style=\"${stagger}border-left-color:${color.hex}\">\n\n    <div class=\"card-header\" onclick=\"toggleCard('${p.id}')\">\n      <div class=\"card-color-bar\" style=\"background:${color.hex}\"><\u002Fdiv>\n      <div class=\"card-main\">\n        <div class=\"card-title-row\">\n          <div class=\"card-title\">${escHtml(p.name)}<\u002Fdiv>\n          <span class=\"priority-badge ${priCls}\">${pri ? pri.short : ''}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"card-meta\">\n          ${p.deadline ? `<span>${overdue?'<span style=\"display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:3px;vertical-align:middle\"><\u002Fspan>':'·'} ${formatDateDisplay(p.deadline)}${overdue?'<span style=\"color:var(--accent)\"> · overdue<\u002Fspan>':''}<\u002Fspan>` : ''}\n          ${p.start    ? `<span>${isFuture(p.start)?'→ starts':'· started'} ${formatDateDisplay(p.start)}<\u002Fspan>` : ''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-chevron\" id=\"chev-${p.id}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"/><\u002Fsvg><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card-progress-wrap\">\n      <div class=\"progress-row\">\n        <div class=\"progress-track${checkboxDriven?' checkbox-driven':''}\"${checkboxDriven?'':` onclick=\"handleTrackClick(event,'${p.id}')\"`}>\n          <div class=\"progress-fill fill-${p.color}\" id=\"fill-${p.id}\" style=\"${stagger}--w:${displayPct}%\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"progress-pct\" id=\"pct-${p.id}\">${progressPctHTML(displayPct
