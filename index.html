swipe-in-right')) {\n    el.style.display = '';\n  }\n  document.getElementById('kanbanBoard').style.display = 'none';\n  document.querySelector('.tabs-wrapper').style.display = '';\n  const tab = state.tabs.find(t => t.id === state.activeTab);\n  if (!tab) return;\n\n  const sm = getSortMode();\n  function srt(arr) {\n    if (sm === 'priority')      return [...arr].sort((a,b) => (a.priority||3)-(b.priority||3));\n    if (sm === 'deadline')      return [...arr].sort((a,b) => { if(!a.deadline&&!b.deadline)return 0; if(!a.deadline)return 1; if(!b.deadline)return -1; return new Date(a.deadline)-new Date(b.deadline); });\n    if (sm === 'deadline-desc') return [...arr].sort((a,b) => { if(!a.deadline&&!b.deadline)return 0; if(!a.deadline)return 1; if(!b.deadline)return -1; return new Date(b.deadline)-new Date(a.deadline); });\n    if (sm === 'start')         return [...arr].sort((a,b) => { if(!a.start&&!b.start)return 0; if(!a.start)return 1; if(!b.start)return -1; return new Date(a.start)-new Date(b.start); });\n    if (sm === 'start-desc')    return [...arr].sort((a,b) => { if(!a.start&&!b.start)return 0; if(!a.start)return 1; if(!b.start)return -1; return new Date(b.start)-new Date(a.start); });\n    return arr;\n  }\n  let active   = srt(state.projects.filter(p => p.tabId === state.activeTab && p.status === 'active'));\n  let shelved  = srt(state.projects.filter(p => p.tabId === state.activeTab && p.status === 'shelved'));\n  let archived = srt(state.projects.filter(p => p.tabId === state.activeTab && p.status === 'archived'));\n\n  let html = `<div class=\"sort-bar\">\n    <span class=\"sort-lbl\">Sort:<\u002Fspan>\n    <button class=\"sort-btn ${sm==='manual'?'active':''}\"           onclick=\"setSort('manual')\">Default<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='priority'?'active':''}\"         onclick=\"setSort('priority')\">Priority<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='deadline'?'active':''}\"         onclick=\"setSort('deadline')\">Due ↑<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='deadline-desc'?'active':''}\"    onclick=\"setSort('deadline-desc')\">Due ↓<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='start'?'active':''}\"            onclick=\"setSort('start')\">Start ↑<\u002Fbutton>\n    <button class=\"sort-btn ${sm==='start-desc'?'active':''}\"       onclick=\"setSort('start-desc')\">Start ↓<\u002Fbutton>\n  <\u002Fdiv>`;\n\n  if (active.length > 0 || shelved.length > 0 || archived.length > 0) {\n    const done = active.filter(p => p.progress === 100).length;\n    const overdue = active.filter(p => p.deadline && isOverdue(p.deadline) && p.progress < 100).length;\n    const shelvedCount = shelved.length;\n    const archivedCount = archived.length;\n    html += `<div class=\"stats-row\" style=\"margin-top:14px\">\n      <div class=\"stat-chip\"><span class=\"stat-num\">${active.length}<\u002Fspan><span class=\"stat-lbl\">Active<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-chip${overdue>0?' overdue':''}\"><span class=\"stat-num\">${overdue}<\u002Fspan><span class=\"stat-lbl\">Overdue<\u002Fspan><\u002Fdiv>\n      ${shelvedCount>0?`<div class=\"stat-chip shelved\"><span class=\"stat-num\">${shelvedCount}<\u002Fspan><span class=\"stat-lbl\">Shelved<\u002Fspan><\u002Fdiv>`:''}\n      ${archivedCount>0?`<div class=\"stat-chip archived\"><span class=\"stat-num\">${archivedCount}<\u002Fspan><span class=\"stat-lbl\">Archived<\u002Fspan><\u002Fdiv>`:''}\n    <\u002Fdiv>`;\n  }\n\n  if (active.length === 0 && !showShelved && !showArchived) {\n    html += `<div class=\"empty\">\n      <svg class=\"empty-graphic\" viewBox=\"0 0 72 72\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n        <rect x=\"12\" y=\"16\" width=\"48\" height=\"44\" rx=\"6\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n        <rect x=\"24\" y=\"10\" width=\"24\" height=\"12\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n        <line x1=\"22\" y1=\"34\" x2=\"50\" y2=\"34\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <line x1=\"22\" y1=\"44\" x2=\"42\" y2=\"44\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n      <\u002Fsvg>\n      <div class=\"empty-title\">No projects in <em>${escHtml(tab.name)}<\u002Fem><\u002Fdiv>\n      <div class=\"empty-sub\">Tap <strong>+<\u002Fstrong> to add your first project here.<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n  if (active.length > 0)   { html += `<div class=\"section-label\">Active<\u002Fdiv>`; active.forEach((p,i) => { html += renderCard(p,i); }); }\n  if (shelved.length > 0)  { html += sectionHeaderHtml('Shelved', shelved.length, showShelved, 'toggleShelvedView', 'shelved-label'); if (showShelved) shelved.forEach((p,i) => { html += renderCard(p,i); }); }\n  if (archived.length > 0) { html += sectionHeaderHtml('Archived', archived.length, showArchived, 'toggleArchiveView'); if (showArchived) archived.forEach((p,i) => { html += renderCard(p,i); }); }\n\n  document.getElementById('mainContent').innerHTML = html;\n\n  // Attach slider listeners\n  document.querySelectorAll('.prog-slider').forEach(slider => {\n    slider.addEventListener('input', function() {\n      const fill = document.getElementById('fill-'+this.dataset.id);\n      const pct  = document.getElementById('pct-'+this.dataset.id);\n      if (fill) fill.style.setProperty('--w', this.value + '%');\n      if (pct)  pct.textContent  = this.value + '%';\n    });\n    slider.addEventListener('change', function() {\n      const p = state.projects.find(x => x.id === this.dataset.id);\n      if (p) { p.progress = +this.value; stampProject(p); saveState(); renderTabs(); }\n    });\n  });\n\n  // Attach checkbox listeners for every rendered card\n  state.projects.filter(p => p.tabId === state.activeTab && p.desc).forEach(p => {\n    const body   = document.getElementById('body-' + p.id);\n    const descEl = body ? body.querySelector('.card-desc.md-body') : null;\n    if (descEl) attachCheckboxListeners(descEl, p.id);\n  });\n}\n\nfunction setSort(mode) {\n  sortModes[state.activeTab] = mode;\n  state.tabSortModes = sortModes;\n  saveState(); renderContent();\n}\n\n// ─── MARKDOWN ───────────────────────────────────────────\nfunction renderMarkdown(raw, projId) {\n  if (!raw) return '';\n\n  // Work from raw lines for accurate line indexing\n  const rawLines = raw.split('\\n');\n  const out = [];\n  let inUl = false, inOl = false;\n  let calloutType = null, calloutLines = [];\n\n  function closeList() {\n    if (inUl) { out.push('<\u002Ful>'); inUl = false; }\n    if (inOl) { out.push('<\u002Fol>'); inOl = false; }\n  }\n  function flushCallout() {\n    if (calloutType === null) return;\n    const type = calloutType.toLowerCase();\n    const cls  = ['warning','caution','danger'].includes(type) ? 'md-callout-warn'\n                : ['tip','hint','important'].includes(type)    ? 'md-callout-tip'\n                : 'md-callout-note';\n    const icon = ['warning','caution','danger'].includes(type) ? '⚠'\n                : ['tip','hint'].includes(type)                ? '💡'\n                : ['important'].includes(type)                 ? '❗'\n                : 'ℹ';\n    const label = calloutType.charAt(0).toUpperCase() + calloutType.slice(1);\n    out.push(`<div class=\"${cls}\"><div class=\"md-callout-title\">${icon} ${label}<\u002Fdiv><div class=\"md-callout-body\">${calloutLines.join(' ')}<\u002Fdiv><\u002Fdiv>`);\n    calloutType = null;\n    calloutLines = [];\n  }\n\n  rawLines.forEach((rawLine, idx) => {\n    // Escape for safe HTML output\n    const line = rawLine\n      .replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');\n\n    // Obsidian callout opener: > [!type]\n    const calloutOpen = line.match(/^&gt;\\s*\\[!([\\w]+)\\]/i);\n    if (calloutOpen) {\n      closeList(); flushCallout();\n      calloutType = calloutOpen[1];\n      return;\n    }\n    // Continuation of callout\n    if (calloutType !== null && /^&gt;/.test(line)) {\n      calloutLines.push(line.replace(/^&gt;\\s*/, ''));\n      return;\n    }\n    if (calloutType !== null) { flushCallout(); }\n\n    // Checkboxes — use idx (raw line index) as the stable reference\n    const cbMatch = rawLine.match(/^[-*]\\s+\\[([ xX\\/])\\]\\s*(.*)/);\n    if (cbMatch) {\n      closeList();\n      const rawState = cbMatch[1];\n      const label    = escHtml(cbMatch[2]);\n      const st       = rawState === ' ' ? 'open' : rawState.toLowerCase() === 'x' ? 'done' : 'prog';\n      const icon     = st === 'done' ? '✓' : st === 'prog' ? '◑' : '';\n      const cls      = st === 'done' ? 'done' : st === 'prog' ? 'prog' : '';\n      // data-line-idx used by attachCheckboxListeners — no inline onclick\n      out.push(`<div class=\"md-cb ${cls}\" data-line-idx=\"${idx}\" style=\"cursor:pointer\"><span class=\"md-cb-box\">${icon}<\u002Fspan><span class=\"md-cb-label\">${label}<\u002Fspan><\u002Fdiv>`);\n      return;\n    }\n\n    if (/^### (.+)/.test(line))     { closeList(); out.push(`<h4>${line.replace(/^### /,'')}<\u002Fh4>`); return; }\n    if (/^## (.+)/.test(line))      { closeList(); out.push(`<h3>${line.replace(/^## /,'')}<\u002Fh3>`); return; }\n    if (/^# (.+)/.test(line))       { closeList(); out.push(`<h2>${line.replace(/^# /,'')}<\u002Fh2>`); return; }\n    if (/^---+$/.test(line.trim())) { closeList(); out.push('<hr>'); return; }\n    if (/^[-*] (.+)/.test(line))    { if (!inUl) { closeList(); out.push('<ul>'); inUl=true; } out.push(`<li>${line.replace(/^[-*] /,'')}<\u002Fli>`); return; }\n    if (/^\\d+\\. (.+)/.test(line))   { if (!inOl) { closeList(); out.push('<ol>'); inOl=true; } out.push(`<li>${line.replace(/^\\d+\\. /,'')}<\u002Fli>`); return; }\n    if (/^&gt; (.+)/.test(line))    { closeList(); out.push(`<blockquote>${line.replace(/^&gt;\\s*/,'')}<\u002Fblockquote>`); return; }\n    if (line.trim() === '')         { closeList(); out.push('<br>'); return; }\n    closeList(); out.push(`<p>${line}<\u002Fp>`);\n  });\n  closeList(); flushCallout();\n\n  return out.join('')\n    .replace(/==(.+?)==/g,          '<mark>$1<\u002Fmark>')\n    .replace(/\\*\\*\\*(.+?)\\*\\*\\*/g,  '<strong><em>$1<\u002Fem><\u002Fstrong>')\n    .replace(/\\*\\*(.+?)\\*\\*/g,      '<strong>$1<\u002Fstrong>')\n    .replace(/\\*(.+?)\\*/g,          '<em>$1<\u002Fem>')\n    .replace(/_(.+?)_/g,            '<em>$1<\u002Fem>')\n    .replace(/~~(.+?)~~/g,          '<s>$1<\u002Fs>')\n    .replace(/`(.+?)`/g,            '<code>$1<\u002Fcode>')\n    .replace(/\\[(.+?)\\]\\((https?:\\/\\/[^\\)]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1<\u002Fa>');\n}\n\n// ─── RENDER CARD ────────────────────────────────────────\nfunction renderCard(p, idx) {\n  const color  = COLORS.find(c => c.id === p.color) || COLORS[3];\n  // Checkboxes in the description (if any) drive the displayed progress\n  const cp             = computeCheckboxProgress(p.desc);\n  const displayPct     = cp ? cp.progress : p.progress;\n  const checkboxDriven = !!cp;\n  const overdue = p.deadline && isOverdue(p.deadline) && displayPct < 100;\n  const pri    = PRIORITIES.find(x => x.val === (p.priority || 3));\n  const priCls = `pri-${p.priority || 3}`;\n  const stagger = idx !== undefined ? `--card-i:${idx};` : '';\n  return `<div class=\"project-card${p.status==='archived'?' archived':''}${p.status==='shelved'?' shelved':''}${overdue?' overdue':''}\" id=\"card-${p.id}\" style=\"${stagger}border-left-color:${color.hex}\">\n\n    <div class=\"card-header\" onclick=\"toggleCard('${p.id}')\">\n      <div class=\"card-color-bar\" style=\"background:${color.hex}\"><\u002Fdiv>\n      <div class=\"card-main\">\n        <div class=\"card-title-row\">\n          <div class=\"card-title\">${escHtml(p.name)}<\u002Fdiv>\n          <span class=\"priority-badge ${priCls}\">${pri ? pri.short : ''}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"card-meta\">\n          ${p.deadline ? `<span>${overdue?'<span style=\"display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:3px;vertical-align:middle\"><\u002Fspan>':'·'} ${formatDateDisplay(p.deadline)}${overdue?'<span style=\"color:var(--accent)\"> · overdue<\u002Fspan>':''}<\u002Fspan>` : ''}\n          ${p.start    ? `<span>${isFuture(p.start)?'→ starts':'· started'} ${formatDateDisplay(p.start)}<\u002Fspan>` : ''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-chevron\" id=\"chev-${p.id}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"/><\u002Fsvg><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card-progress-wrap\">\n      <div class=\"progress-row\">\n        <div class=\"progress-track${checkboxDriven?' checkbox-driven':''}\"${checkboxDriven?'':` onclick=\"handleTrackClick(event,'${p.id}')\"`}>\n          <div class=\"progress-fill fill-${p.color}\" id=\"fill-${p.id}\" style=\"${stagger}--w:${displayPct}%\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"progress-pct\" id=\"pct-${p.id}\">${progressPctHTML(displayPct, cp)}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card-body\" id=\"body-${p.id}\">\n      ${p.desc ? `<div class=\"card-desc md-body\">${renderMarkdown(p.desc, p.id)}<\u002Fdiv>` : ''}\n      <div class=\"card-dates\">\n        ${p.start    ? `<div class=\"date-chip start\">${isFuture(p.start)?'▶ Starts:':'▶ Started:'} ${formatDateDisplay(p.start)}<\u002Fdiv>` : ''}\n        ${p.deadline ? `<div class=\"date-chip deadline\">⏳ Due: ${formatDateDisplay(p.deadline)}<\u002Fdiv>` : ''}\n      <\u002Fdiv>\n      ${checkboxDriven\n        ? `<div class=\"checkbox-progress-note\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><polyline points=\"9 12 11 14 15 10\"/><\u002Fsvg>\n            <span>Progress auto-tracked: <strong>${cp.done}<\u002Fstrong> of <strong>${cp.total}<\u002Fstrong> checkbox${cp.total===1?'':'es'} complete.<\u002Fspan>\n          <\u002Fdiv>`\n        : `<div class=\"slider-wrap\" style=\"margin-bottom:12px\">\n        <label style=\"display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px\">Adjust Progress<\u002Flabel>\n        <div class=\"progress-row\">\n          <input type=\"range\" class=\"prog-slider\" data-id=\"${p.id}\" min=\"0\" max=\"100\" value=\"${p.progress}\">\n          <span class=\"progress-pct\" style=\"pointer-events:none\">&nbsp;<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>`}\n      <div class=\"card-actions\">\n        <button class=\"card-action-btn\" onclick=\"openEditProject('${p.id}')\" title=\"Edit\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"/><path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"/><\u002Fsvg>\n        <\u002Fbutton>\n        ${p.status !== 'active' ? `<button class=\"card-action-btn success\" onclick=\"setProjectStatus('${p.id}','active')\" title=\"Activate\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"1 4 1 10 7 10\"/><path d=\"M3.51 15a9 9 0 1 0 .49-4.95\"/><\u002Fsvg>\n            <\u002Fbutton>` : ''}\n        ${p.status !== 'shelved' ? `<button class=\"card-action-btn\" onclick=\"setProjectStatus('${p.id}','shelved')\" title=\"Shelve\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/><line x1=\"10\" y1=\"13\" x2=\"14\" y2=\"13\"/><\u002Fsvg>\n            <\u002Fbutton>` : ''}\n        ${p.status !== 'archived' ? `<button class=\"card-action-btn\" onclick=\"setProjectStatus('${p.id}','archived')\" title=\"Archive\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"21 8 21 21 3 21 3 8\"/><rect x=\"1\" y=\"3\" width=\"22\" height=\"5\" rx=\"1\"/><line x1=\"10\" y1=\"12\" x2=\"14\" y2=\"12\"/><\u002Fsvg>\n            <\u002Fbutton>` : ''}\n\n        <button class=\"card-action-btn danger\" onclick=\"deleteProject('${p.id}')\" title=\"Delete\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><path d=\"M10 11v6M14 11v6\"/><path d=\"M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2\"/><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction escHtml(s) {\n  return String(s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');\n}\n\nfunction toggleCard(id) {\n  const body = document.getElementById('body-'+id);\n  const chev = document.getElementById('chev-'+id);\n  if (body) { const open = body.classList.toggle('open'); if (chev) chev.classList.toggle('open', open); }\n}\n\nfunction handleTrackClick(e, id) {\n  const p = state.projects.find(x => x.id === id);\n  if (!p) return;\n  // When checkboxes drive progress, the track is not interactive\n  if (computeCheckboxProgress(p.desc)) return;\n  const rect = e.currentTarget.getBoundingClientRect();\n  const pct  = Math.round(((e.clientX - rect.left) / rect.width) * 100);\n  p.progress = pct; stampProject(p); saveState();\n  const fill = document.getElementById('fill-'+id);\n  const pctEl = document.getElementById('pct-'+id);\n  const slider = document.querySelector(`.prog-slider[data-id=\"${id}\"]`);\n  if (fill) fill.style.setProperty('--w', pct + '%');\n  if (pctEl) pctEl.innerHTML = progressPctHTML(pct, null);\n  if (slider) slider.value = pct;\n}\n\n// ─── ARCHIVE ────────────────────────────────────────────\nfunction setProjectStatus(id, status) {\n  const p = state.projects.find(x => x.id === id);\n  if (!p) return;\n  p.status = status;\n  if (status === 'archived') p.progress = 100;\n  stampProject(p); saveState(); render();\n}\nfunction archiveProject(id) { setProjectStatus(id, 'archived'); }\nfunction unarchiveProject(id) { setProjectStatus(id, 'active'); }\nfunction deleteProject(id) {\n  if (!confirm('Delete this project? This cannot be undone.')) return;\n  state.projects = state.projects.filter(x => x.id !== id);\n  if (!state.tombstones) state.tombstones = {};\n  state.tombstones[id] = new Date().toISOString();\n  state._tabTs = new Date().toISOString();\n  saveState(); render();\n}\nfunction toggleArchiveView() {\n  showArchived = !showArchived;\n  if (isDesktop()) renderKanban(); else renderContent();\n}\nfunction toggleShelvedView() {\n  showShelved = !showShelved;\n  if (isDesktop()) renderKanban(); else renderContent();\n}\nfunction sectionHeaderHtml(title, count, isOpen, toggleFn, extraClass) {\n  return `<div class=\"section-label toggle-label ${extraClass||''}\" onclick=\"${toggleFn}()\"><span>${title}<\u002Fspan><span class=\"section-count\">${count}<\u002Fspan><span class=\"mini-switch${isOpen?' on':''}\"><span class=\"mini-switch-knob\"><\u002Fspan><\u002Fspan><\u002Fdiv>`;\n}\n\n// ─── PICKERS ────────────────────────────────────────────\nfunction renderColorPicker(containerId, selectedId, onSelect) {\n  const el = document.getElementById(containerId);\n  if (!el) return;\n  el.innerHTML = '';\n  COLORS.forEach(c => {\n    const sw = document.createElement('div');\n    sw.className = 'color-swatch' + (c.id === selectedId ? ' selected' : '');\n    sw.style.background = c.hex;\n    sw.onclick = () => { el.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected')); sw.classList.add('selected'); onSelect(c.id); };\n    el.appendChild(sw);\n  });\n}\n\nfunction renderPriorityPicker(selectedVal, onSelect) {\n  const el = document.getElementById('priorityPicker');\n  if (!el) return;\n  el.innerHTML = '';\n  PRIORITIES.forEach(pri => {\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    btn.className = `pri-option po-${pri.val}${pri.val === selectedVal ? ' selected' : ''}`;\n    btn.textContent = pri.label;\n    btn.onclick = () => { el.querySelectorAll('.pri-option').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); onSelect(pri.val); };\n    el.appendChild(btn);\n  });\n}\n\n// ─── ADD / EDIT PROJECT ─────────────────────────────────\nfunction openAddProject() {\n  editingProjectId = null;\n  document.getElementById('sheetTitle').textContent = 'New Project';\n  document.getElementById('projName').value = '';\n  document.getElementById('projDesc').value = '';\n  document.getElementById('projProgress').value = 0;\n  document.getElementById('projProgressVal').textContent = '0%';\n  document.getElementById('projStart').value = '';\n  document.getElementById('projDeadline').value = '';\n  selectedColor = 'blue'; selectedPriority = 3;\n  renderColorPicker('colorPicker', selectedColor, c => { selectedColor = c; });\n  renderPriorityPicker(selectedPriority, v => { selectedPriority = v; });\n  const sel = document.getElementById('projTab');\n  sel.innerHTML = state.tabs.map(t => `<option value=\"${t.id}\" ${t.id===state.activeTab?'selected':''}>${t.name}<\u002Foption>`).join('');\n  document.getElementById('projectOverlay').classList.add('open');\n  const fab = document.getElementById('mainFab');\n  if (fab) fab.classList.add('sheet-open');\n  setTimeout(() => document.getElementById('projName').focus(), 200);\n}\n\nfunction openEditProject(id) {\n  const p = state.projects.find(x => x.id === id);\n  if (!p) return;\n  editingProjectId = id;\n  document.getElementById('sheetTitle').textContent = 'Edit Project';\n  document.getElementById('projName').value = p.name;\n  document.getElementById('projDesc').value = p.desc || '';\n  document.getElementById('projProgress').value = p.progress;\n  document.getElementById('projProgressVal').textContent = p.progress + '%';\n  document.getElementById('projStart').value = p.start || '';\n  document.getElementById('projDeadline').value = p.deadline || '';\n  selectedColor = p.color || 'blue'; selectedPriority = p.priority || 3;\n  renderColorPicker('colorPicker', selectedColor, c => { selectedColor = c; });\n  renderPriorityPicker(selectedPriority, v => { selectedPriority = v; });\n  const sel = document.getElementById('projTab');\n  sel.innerHTML = state.tabs.map(t => `<option value=\"${t.id}\" ${t.id===p.tabId?'selected':''}>${t.name}<\u002Foption>`).join('');\n  document.getElementById('projectOverlay').classList.add('open');\n}\n\nfunction saveProject() {\n  const name = document.getElementById('projName').value.trim();\n  if (!name) { document.getElementById('projName').focus(); return; }\n  const tabId = document.getElementById('projTab').value || state.activeTab;\n  if (editingProjectId) {\n    const p = state.projects.find(x => x.id === editingProjectId);\n    if (p) {\n      p.name = name; p.desc = document.getElementById('projDesc').value.trim();\n      p.progress = +document.getElementById('projProgress').value;\n      p.start = document.getElementById('projStart').value || null;\n      p.deadline = document.getElementById('projDeadline').value || null;\n      p.color = selectedColor; p.priority = selectedPriority; p.tabId = tabId;\n      // Checkboxes in the description override the manual slider\n      const cp = computeCheckboxProgress(p.desc);\n      if (cp) p.progress = cp.progress;\n      stampProject(p);\n    }\n  } else {\n    const newProj = {\n      id: uid(), name, desc: document.getElementById('projDesc').value.trim(),\n      progress: +document.getElementById('projProgress').value,\n      start: document.getElementById('projStart').value || null,\n      deadline: document.getElementById('projDeadline').value || null,\n      color: selectedColor, priority: selectedPriority,\n      tabId, status: 'active', created: Date.now()\n    };\n    const cp = computeCheckboxProgress(newProj.desc);\n    if (cp) newProj.progress = cp.progress;\n    stampProject(newProj);\n    state.projects.push(newProj);\n  }\n  saveState(); closeSheet('projectOverlay'); state.activeTab = tabId; render();\n}\n\n// ─── TABS ────────────────────────────────────────────────\nfunction openNewTabSheet() {\n  selectedTabColor = 'teal';\n  document.getElementById('newTabName').value = '';\n  renderColorPicker('tabColorPicker', selectedTabColor, c => { selectedTabColor = c; });\n  document.getElementById('tabOverlay').classList.add('open');\n  setTimeout(() => document.getElementById('newTabName').focus(), 200);\n}\n\nfunction saveNewTab() {\n  const name = document.getElementById('newTabName').value.trim();\n  if (!name) { document.getElementById('newTabName').focus(); return; }\n  const id = 'tab_' + uid();\n  state.tabs.push({ id, name, color: selectedTabColor });\n  state.activeTab = id;\n  state._tabTs = new Date().toISOString();\n  saveState(); closeSheet('tabOverlay'); render();\n}\n\nfunction openEditTab(tabId) {\n  editingTabId = tabId;\n  const tab = state.tabs.find(t => t.id === tabId);\n  if (!tab) return;\n  editTabColorVal = tab.color;\n  document.getElementById('editTabName').value = tab.name;\n  renderColorPicker('editTabColorPicker', editTabColorVal, c => { editTabColorVal = c; });\n  document.getElementById('editTabOverlay').classList.add('open');\n}\n\nfunction saveEditTab() {\n  const tab = state.tabs.find(t => t.id === editingTabId);\n  const name = document.getElementById('editTabName').value.trim();\n  if (!name || !tab) return;\n  tab.name = name; tab.color = editTabColorVal;\n  state._tabTs = new Date().toISOString();\n  saveState(); closeSheet('editTabOverlay'); render();\n}\n\nfunction deleteTab() {\n  if (!confirm('Delete this list and all its projects?')) return;\n  state.projects = state.projects.filter(p => p.tabId !== editingTabId);\n  state.tabs = state.tabs.filter(t => t.id !== editingTabId);\n  if (state.activeTab === editingTabId) state.activeTab = 'general';\n  state._tabTs = new Date().toISOString();\n  saveState(); closeSheet('editTabOverlay'); render();\n}\n\n// ─── UTILS ──────────────────────────────────────────────\nfunction closeSheet(id) {\n  document.getElementById(id).classList.remove('open');\n  const fab = document.getElementById('mainFab');\n  if (fab) fab.classList.remove('sheet-open');\n}\nfunction overlayClose(e, id) { if (e.target === document.getElementById(id)) closeSheet(id); }\n\n// ─── CHECKBOX-DRIVEN PROGRESS ───────────────────────────\n// Scans a project description for `- [ ]` / `- [x]` / `- [/]` lines.\n// Returns { done, partial, total, progress } or null when there are no checkboxes.\n// `[/]` (in-progress) counts as 0.5; rounded to nearest int.\nfunction computeCheckboxProgress(desc) {\n  if (!desc) return null;\n  let done = 0, partial = 0, total = 0;\n  const lines = desc.split('\\n');\n  for (const line of lines) {\n    const m = line.match(/^\\s*[-*]\\s+\\[([ xX\\/])\\]/);\n    if (!m) continue;\n    total++;\n    const ch = m[1].toLowerCase();\n    if (ch === 'x') done++;\n    else if (ch === '/') partial++;\n  }\n  if (total === 0) return null;\n  const progress = Math.round(((done + partial * 0.5) / total) * 100);\n  return { done, partial, total, progress };\n}\n\n// Build the inner HTML for the progress percent label,\n// optionally including a completion check when checkboxes drive progress.\nfunction progressPctHTML(progress, cp) {\n  const complete = progress === 100;\n  const check    = complete ? '<span class=\"cb-check\" title=\"Complete\">✓<\u002Fspan>' : '';\n  return `<span>${progress}%<\u002Fspan>${check}`;\n}\n\n// ─── CHECKBOX CYCLING ───────────────────────────────────\n// Cycles: open [ ] → done [x] → in-progress [/] → open\nfunction cycleCheckbox(projId, lineIdx) {\n  const p = state.projects.find(x => x.id === projId);\n  if (!p || !p.desc) return;\n\n  const lines = p.desc.split('\\n');\n  if (lineIdx < 0 || lineIdx >= lines.length) return;\n\n  const line = lines[lineIdx];\n  const cbMatch = line.match(/^([-*]\\s+\\[)([ xX\\/])(\\].*)/);\n  if (!cbMatch) return;\n\n  const cur  = cbMatch[2];\n  const next = cur === ' ' ? 'x' : cur.toLowerCase() === 'x' ? '/' : ' ';\n  lines[lineIdx] = cbMatch[1] + next + cbMatch[3];\n  p.desc = lines.join('\\n');\n\n  // If the description has any checkboxes, they now drive the progress value.\n  const cp = computeCheckboxProgress(p.desc);\n  if (cp) p.progress = cp.progress;\n\n  stampProject(p);   // bump _ts so sync merge picks up this change on other devices\n  saveState();\n\n  // Update the card's progress UI in place (no full re-render)\n  const fill  = document.getElementById('fill-' + projId);\n  const pctEl = document.getElementById('pct-' + projId);\n  const track = document.querySelector(`#card-${projId} .progress-track`);\n  const note  = document.querySelector(`#card-${projId} .checkbox-progress-note span`);\n  if (fill)  fill.style.setProperty('--w', p.progress + '%');\n  if (pctEl) pctEl.innerHTML = progressPctHTML(p.progress, cp);\n  if (track) track.classList.toggle('checkbox-driven', !!cp);\n  if (note && cp) {\n    note.innerHTML = `Progress auto-tracked: <strong>${cp.done}<\u002Fstrong> of <strong>${cp.total}<\u002Fstrong> checkbox${cp.total===1?'':'es'} complete.`;\n  }\n\n  // Re-render the description, passing projId so checkboxes stay clickable\n  const body   = document.getElementById('body-' + projId);\n  const descEl = body ? body.querySelector('.card-desc.md-body') : null;\n  if (descEl) {\n    descEl.innerHTML = renderMarkdown(p.desc, projId);\n    attachCheckboxListeners(descEl, projId);\n  }\n}\n\n// Attach click listeners to all .md-cb elements in a container\n// This is called after every description render so handlers are always fresh\nfunction attachCheckboxListeners(container, projId) {\n  container.querySelectorAll('.md-cb').forEach(el => {\n    const idx = parseInt(el.dataset.lineIdx, 10);\n    // Remove any old listener by replacing with clone\n    const clone = el.cloneNode(true);\n    el.parentNode.replaceChild(clone, el);\n    clone.addEventListener('click', (e) => {\n      e.stopPropagation();\n      const box = clone.querySelector('.md-cb-box');\n      if (box) { box.classList.remove('popping'); void box.offsetWidth; box.classList.add('popping'); }\n      setTimeout(() => cycleCheckbox(projId, idx), 260);\n    });\n  });\n}\n\n// ─── MARKDOWN TOOLBAR INSERT ────────────────────────────\nfunction mdInsert(type) {\n  const ta = document.getElementById('projDesc');\n  if (!ta) return;\n  ta.focus();\n  const start = ta.selectionStart;\n  const end   = ta.selectionEnd;\n  const sel   = ta.value.substring(start, end);\n  const before = ta.value.substring(0, start);\n  const after  = ta.value.substring(end);\n\n  // Helper: ensure we're at a new line before block elements\n  const needsNewline = before.length > 0 && !before.endsWith('\\n');\n\n  let insert = '';\n  let cursorOffset = 0; // where to place cursor after insert\n\n  switch(type) {\n    case 'checkbox':\n      insert = (needsNewline ? '\\n' : '') + '- [ ] ';\n      cursorOffset = insert.length;\n      break;\n    case 'bold':\n      insert = sel ? `**${sel}**` : '**bold text**';\n      cursorOffset = sel ? insert.length : 2;\n      break;\n    case 'italic':\n      insert = sel ? `*${sel}*` : '*italic text*';\n      cursorOffset = sel ? insert.length : 1;\n      break;\n    case 'highlight':\n      insert = sel ? `==${sel}==` : '==highlighted text==';\n      cursorOffset = sel ? insert.length : 2;\n      break;\n    case 'strike':\n      insert = sel ? `~~${sel}~~` : '~~strikethrough~~';\n      cursorOffset = sel ? insert.length : 2;\n      break;\n    case 'bullet':\n      insert = (needsNewline ? '\\n' : '') + '- ';\n      cursorOffset = insert.length;\n      break;\n    case 'numbered':\n      insert = (needsNewline ? '\\n' : '') + '1. ';\n      cursorOffset = insert.length;\n      break;\n    case 'note':\n      insert = (needsNewline ? '\\n' : '') + '> [!note]\\n> ';\n      cursorOffset = insert.length;\n      break;\n    case 'tip':\n      insert = (needsNewline ? '\\n' : '') + '> [!tip]\\n> ';\n      cursorOffset = insert.length;\n      break;\n    case 'warning':\n      insert = (needsNewline ? '\\n' : '') + '> [!warning]\\n> ';\n      cursorOffset = insert.length;\n      break;\n    case 'h2':\n      insert = (needsNewline ? '\\n' : '') + '## ';\n      cursorOffset = insert.length;\n      break;\n    case 'divider':\n      insert = (needsNewline ? '\\n' : '') + '---\\n';\n      cursorOffset = insert.length;\n      break;\n    case 'code':\n      insert = sel ? '`' + sel + '`' : '`code`';\n      cursorOffset = sel ? insert.length : 1;\n      break;\n  }\n\n  ta.value = before + insert + after;\n  const newCursor = start + cursorOffset;\n  ta.setSelectionRange(newCursor, newCursor);\n  ta.focus();\n}\n\n// ─── VIEW STATE ─────────────────────────────────────────\nlet currentView = 'kanban'; // 'kanban' | 'gantt'\n\nfunction toggleView() {\n  currentView = currentView === 'kanban' ? 'gantt' : 'kanban';\n  updateViewToggleIcon();\n  if (currentView === 'gantt') {\n    showGanttView();\n  } else {\n    hideGanttView();\n    render();\n  }\n}\n\nfunction updateViewToggleIcon() {\n  const icon = document.getElementById('viewToggleIcon');\n  const btn  = document.getElementById('viewToggleBtn');\n  if (!icon) return;\n  if (currentView === 'kanban') {\n    // Show Gantt icon (horizontal bars) to indicate \"switch to Gantt\"\n    icon.innerHTML = '<line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"15\" y2=\"10\"/><line x1=\"3\" y1=\"14\" x2=\"18\" y2=\"14\"/><line x1=\"3\" y1=\"18\" x2=\"12\" y2=\"18\"/>';\n    btn.title = 'Switch to Gantt view';\n  } else {\n    // Show Kanban icon (vertical columns) to indicate \"switch to Kanban\"\n    icon.innerHTML = '<rect x=\"3\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\"/><rect x=\"10\" y=\"3\" width=\"5\" height=\"12\" rx=\"1\"/><rect x=\"17\" y=\"3\" width=\"5\" height=\"15\" rx=\"1\"/>';\n    btn.title = 'Switch to Kanban view';\n  }\n}\n\nfunction showGanttView() {\n  document.getElementById('ganttView').style.display = 'block';\n  document.getElementById('mainContent').style.display = 'none';\n  document.getElementById('kanbanBoard').style.display = 'none';\n  document.querySelector('.tabs-wrapper').style.display = 'none';\n  document.querySelector('.fab').style.display = 'none';\n  renderGantt();\n}\n\nfunction hideGanttView() {\n  document.getElementById('ganttView').style.display = 'none';\n  document.querySelector('.fab').style.display = '';\n  document.querySelector('.tabs-wrapper').style.display = '';\n}\n\n// ─── GANTT STATE ────────────────────────────────────────\nconst GANTT_COLORS = {\n  red:'#c84b31',green:'#2d6a4f',gold:'#e9a825',blue:'#2980b9',\n  purple:'#8e44ad',teal:'#16a085',orange:'#e67e22',pink:'#e91e8c'\n};\nconst ZOOM_LEVELS = [\n  { id:'week',   label:'Week',    days:14,  cellDays:1,  cellW:42,  fmt:'ddd D'   },\n  { id:'month',  label:'Month',   days:60,  cellDays:7,  cellW:52,  fmt:'MMM D'   },\n  { id:'quarter',label:'Quarter', days:120, cellDays:14, cellW:60,  fmt:'MMM D'   },\n  { id:'year',   label:'Year',    days:365, cellDays:30, cellW:64,  fmt:'MMM YY'  },\n];\nlet ganttZoom        = 1;        // index into ZOOM_LEVELS\nlet ganttOffset      = 0;        // days offset from today\nlet ganttListFilter  = null;     // Set of active tab IDs, null = all\nlet ganttShowArchived = false;\nlet ganttShowShelved = false;\n\nfunction ganttStartDate() {\n  const z = ZOOM_LEVELS[ganttZoom];\n  const d = new Date();\n  d.setDate(d.getDate() - Math.floor(z.days * 0.3) + ganttOffset);\n  d.setHours(0,0,0,0);\n  return d;\n}\n\nfunction addDays(date, n) {\n  const d = new Date(date);\n  d.setDate(d.getDate() + n);\n  return d;\n}\n\nfunction daysBetween(a, b) {\n  return Math.round((b - a) / 86400000);\n}\n\nfunction fmtAxisLabel(date, cellDays) {\n  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n  const days   = ['Su','Mo','Tu','We','Th','Fr','Sa'];\n  if (cellDays === 1)  return `${days[date.getDay()]} ${date.getDate()}`;\n  if (cellDays === 7)  return `${months[date.getMonth()]} ${date.getDate()}`;\n  if (cellDays === 14) return `${months[date.getMonth()]} ${date.getDate()}`;\n  return `${months[date.getMonth()]} '${String(date.getFullYear()).slice(2)}`;\n}\n\n// ─── GANTT RENDER ────────────────────────────────────────\nfunction renderGantt() {\n  const z         = ZOOM_LEVELS[ganttZoom];\n  const start     = ganttStartDate();\n  const totalDays = z.days;\n  const cellDays  = z.cellDays;\n  const totalCols = Math.ceil(totalDays / cellDays);\n  const scrollEl  = document.getElementById('ganttScroll');\n  const availW    = scrollEl ? scrollEl.clientWidth : 0;\n  const cellW     = Math.max(z.cellW, availW / totalCols);\n  const today     = new Date(); today.setHours(0,0,0,0);\n\n  // Filter projects\n  const activeTabs = ganttListFilter\n    ? state.tabs.filter(t => ganttListFilter.has(t.id))\n    : state.tabs;\n  const visibleTabIds = new Set(activeTabs.map(t => t.id));\n\n  let projects = state.projects.filter(p =>\n    visibleTabIds.has(p.tabId) &&\n    (p.status === 'active' || (p.status === 'shelved' && ganttShowShelved) || (p.status === 'archived' && ganttShowArchived))\n  );\n\n  // Build controls\n  renderGanttControls(z, activeTabs);\n\n  // Build axis cells info\n  const cols = [];\n  for (let i = 0; i < totalCols; i++) {\n    const d = addDays(start, i * cellDays);\n    const isToday = daysBetween(d, today) >= 0 && daysBetween(d, today) < cellDays;\n    cols.push({ date: d, isToday });\n  }\n\n  const totalW = totalCols * cellW;\n\n  // Build sidebar and grid HTML together, grouped by list\n  let sidebarHtml = `<div class=\"gantt-sidebar-spacer\"><\u002Fdiv>`;\n  let gridHtml    = `<div class=\"gantt-inner\" id=\"ganttInner\" style=\"width:${totalW}px\">`;\n\n  // Axis row\n  gridHtml += `<div class=\"gantt-axis\" style=\"width:${totalW}px\">`;\n  cols.forEach(c => {\n    gridHtml += `<div class=\"gantt-axis-cell${c.isToday?' today-col':''}\" style=\"width:${cellW}px;min-width:${cellW}px\">${fmtAxisLabel(c.date, cellDays)}<\u002Fdiv>`;\n  });\n  gridHtml += `<\u002Fdiv>`;\n\n  // Today line position\n  const todayOffset = daysBetween(start, today);\n  const todayX = (todayOffset / cellDays) * cellW + cellW * 0.5;\n\n  activeTabs.forEach(tab => {\n    const tabProjects = projects.filter(p => p.tabId === tab.id);\n    if (tabProjects.length === 0) return;\n\n    const color = COLORS.find(c => c.id === tab.color)?.hex || '#2980b9';\n\n    // Group header\n    sidebarHtml += `<div class=\"gantt-group-label\"><span style=\"width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block\"><\u002Fspan>${escHtml(tab.name)}<\u002Fdiv>`;\n    gridHtml += `<div class=\"gantt-group-header-row\" style=\"width:${totalW}px\">`;\n    cols.forEach(c => {\n      gridHtml += `<div class=\"gantt-cell${c.isToday?' today-col':''}\" style=\"width:${cellW}px;min-width:${cellW}px\"><\u002Fdiv>`;\n    });\n    gridHtml += `<\u002Fdiv>`;\n\n    tabProjects.forEach(p => {\n      const pColor = GANTT_COLORS[p.color] || '#2980b9';\n      const overdue = p.deadline && isOverdue(p.deadline) && p.progress < 100;\n\n      sidebarHtml += `<div class=\"gantt-row-label\" title=\"${escHtml(p.name)}\">${escHtml(p.name)}<\u002Fdiv>`;\n\n      gridHtml += `<div class=\"gantt-row\" style=\"width:${totalW}px\">`;\n      cols.forEach(c => {\n        gridHtml += `<div class=\"gantt-cell${c.isToday?' today-col':''}\" style=\"width:${cellW}px;min-width:${cellW}px\"><\u002Fdiv>`;\n      });\n\n      // Today line\n      if (todayX >= 0 && todayX <= totalW) {\n        gridHtml += `<div class=\"gantt-today-line\" style=\"left:${todayX}px\"><\u002Fdiv>`;\n      }\n\n      // Determine bar type\n      if (!p.start && !p.deadline) {\n        // No dates — skip bar, just empty row\n      } else if (!p.start && p.deadline) {\n        // Milestone — diamond at deadline\n        const deadlineDate = new Date(p.deadline); deadlineDate.setHours(0,0,0,0);\n        const dx = daysBetween(start, deadlineDate);\n        const x  = (dx / cellDays) * cellW + cellW * 0.5 - 10;\n        if (x >= -10 && x <= totalW + 10) {\n          gridHtml += `<div class=\"gantt-milestone${overdue?' overdue':''}\"\n            style=\"left:${x}px;background:${pColor}\"\n            onclick=\"showGanttPopup(event,'${p.id}')\"\n            title=\"${escHtml(p.name)}\"><\u002Fdiv>`;\n        }\n      } else if (p.start && !p.deadline) {\n        // Open-ended bar\n        const startDate = new Date(p.start); startDate.setHours(0,0,0,0);\n        const sx = daysBetween(start, startDate);\n        const x  = (sx / cellDays) * cellW;\n        const w  = totalW - x;\n        if (x <= totalW) {\n          const progressW = Math.round((p.progress / 100) * Math.min(w, totalW - x));\n          gridHtml += `<div class=\"gantt-bar\" style=\"left:${Math.max(0,x)}px;width:${Math.min(w,totalW-Math.max(0,x))}px;background:${pColor};mask-image:linear-gradient(to right, black 70%, transparent 100%);-webkit-mask-image:linear-gradient(to right, black 70%, transparent 100%)\"\n            onclick=\"showGanttPopup(event,'${p.id}')\">\n            <div class=\"gantt-bar-progress\" style=\"width:${p.progress}%\"><\u002Fdiv>\n            <span class=\"gantt-bar-label\">${escHtml(p.name)}<\u002Fspan>\n            <span class=\"gantt-open-arrow\" style=\"position:relative;z-index:2\">›<\u002Fspan>\n          <\u002Fdiv>`;\n        }\n      } else {\n        // Normal bar with start and deadline\n        const startDate   = new Date(p.start);   startDate.setHours(0,0,0,0);\n        const deadlineDate = new Date(p.deadline); deadlineDate.setHours(0,0,0,0);\n        const sx = daysBetween(start, startDate);\n        const ex = daysBetween(start, deadlineDate);\n        const x  = (sx / cellDays) * cellW;\n        const x2 = (ex / cellDays) * cellW + cellW;\n        const w  = Math.max(x2 - x, 20);\n        const clampedX = Math.max(0, x);\n        const clampedW = Math.min(w - (clampedX - x), totalW - clampedX);\n        if (clampedW > 0 && clampedX <= totalW) {\n          gridHtml += `<div class=\"gantt-bar${overdue?' overdue':''}\"\n            style=\"left:${clampedX}px;width:${clampedW}px;background:${pColor}\"\n            onclick=\"showGanttPopup(event,'${p.id}')\">\n            <div class=\"gantt-bar-progress\" style=\"width:${p.progress}%\"><\u002Fdiv>\n            <span class=\"gantt-bar-label\">${escHtml(p.name)}<\u002Fspan>\n          <\u002Fdiv>`;\n        }\n      }\n\n      gridHtml += `<\u002Fdiv>`;\n    });\n  });\n\n  if (projects.length === 0) {\n    sidebarHtml += `<div style=\"padding:20px 8px;font-size:10px;color:var(--muted);line-height:1.5\">No projects to show<\u002Fdiv>`;\n    gridHtml += `<div style=\"padding:40px 20px;text-align:center;font-size:12px;color:var(--muted)\">No projects visible with current filters<\u002Fdiv>`;\n  }\n\n  gridHtml += `<\u002Fdiv>`;\n\n  document.getElementById('ganttSidebar').innerHTML = sidebarHtml;\n  document.getElementById('ganttScroll').innerHTML  = gridHtml;\n\n  // Sync sidebar scroll with grid scroll\n  const scroll  = document.getElementById('ganttScroll');\n  const sidebar = document.getElementById('ganttSidebar');\n  scroll.addEventListener('scroll', () => {\n    sidebar.scrollTop = scroll.scrollTop;\n  }, { passive: true });\n\n  // Scroll to today\n  const todayScrollX = Math.max(0, todayX - (scroll.clientWidth * 0.3));\n  scroll.scrollLeft = todayScrollX;\n\n  // Dismiss popup on scroll\n  scroll.addEventListener('scroll', dismissGanttPopup, { passive: true });\n}\n\nfunction renderGanttControls(z, activeTabs) {\n  const ctrl = document.getElementById('ganttControls');\n  if (!ctrl) return;\n\n  // Row 1: nav + zoom\n  let html = `<div class=\"gantt-controls-row\">\n    <button class=\"gantt-nav-btn\" onclick=\"ganttPan(-1)\">‹<\u002Fbutton>\n    <button class=\"gantt-today-btn\" onclick=\"ganttGoToday()\">Today<\u002Fbutton>\n    <button class=\"gantt-nav-btn\" onclick=\"ganttPan(1)\">›<\u002Fbutton>\n    <div class=\"gantt-sep\"><\u002Fdiv>`;\n  ZOOM_LEVELS.forEach((zl, i) => {\n    html += `<button class=\"gantt-zoom-btn${i===ganttZoom?' active':''}\" onclick=\"setGanttZoom(${i})\">${zl.label}<\u002Fbutton>`;\n  });\n  html += `<\u002Fdiv>`;\n\n  // Row 2: list filters + archive toggle\n  html += `<div class=\"gantt-controls-row\">\n    <button class=\"gantt-filter-chip${ganttListFilter===null?' active':''}\" onclick=\"ganttFilterAll()\">All<\u002Fbutton>\n    <div class=\"gantt-sep\"><\u002Fdiv>`;\n  state.tabs.forEach(tab => {\n    const color   = GANTT_COLORS[tab.color] || '#2980b9';\n    const isActive = ganttListFilter === null || ganttListFilter.has(tab.id);\n    html += `<button class=\"gantt-filter-chip${isActive?' active':''}\" onclick=\"ganttToggleFilter('${tab.id}')\">\n      <span class=\"gantt-chip-dot\" style=\"background:${color}\"><\u002Fspan>${escHtml(tab.name)}\n    <\u002Fbutton>`;\n  });\n  html += `<div class=\"gantt-sep\"><\u002Fdiv>\n    <button class=\"gantt-filter-chip${ganttShowShelved?' active':''}\" onclick=\"ganttToggleShelved()\">Shelved<\u002Fbutton>\n    <button class=\"gantt-filter-chip${ganttShowArchived?' active':''}\" onclick=\"ganttToggleArchived()\">Archived<\u002Fbutton>\n  <\u002Fdiv>`;\n\n  ctrl.innerHTML = html;\n}\n\nfunction ganttPan(dir) {\n  const z = ZOOM_LEVELS[ganttZoom];\n  ganttOffset += dir * Math.floor(z.days * 0.5);\n  renderGantt();\n}\n\nfunction ganttGoToday() {\n  ganttOffset = 0;\n  renderGantt();\n}\n\nfunction setGanttZoom(idx) {\n  ganttZoom = idx;\n  renderGantt();\n}\n\nfunction ganttFilterAll() {\n  ganttListFilter = null;\n  renderGantt();\n}\n\nfunction ganttToggleFilter(tabId) {\n  if (ganttListFilter === null) {\n    // Start with all tabs selected, then deselect the tapped one\n    ganttListFilter = new Set(state.tabs.map(t => t.id));\n    ganttListFilter.delete(tabId);\n  } else {\n    if (ganttListFilter.has(tabId)) {\n      ganttListFilter.delete(tabId);\n      if (ganttListFilter.size === 0) ganttListFilter = null; // back to all\n    } else {\n      ganttListFilter.add(tabId);\n      if (ganttListFilter.size === state.tabs.length) ganttListFilter = null;\n    }\n  }\n  renderGantt();\n}\n\nfunction ganttToggleArchived() {\n  ganttShowArchived = !ganttShowArchived;\n  renderGantt();\n}\nfunction ganttToggleShelved() {\n  ganttShowShelved = !ganttShowShelved;\n  renderGantt();\n}\n\n// ─── GANTT POPUP ─────────────────────────────────────────\nfunction showGanttPopup(e, projId) {\n  e.stopPropagation();\n  const p = state.projects.find(x => x.id === projId);\n  if (!p) return;\n\n  const pri    = PRIORITIES.find(x => x.val === (p.priority || 3));\n  const color  = GANTT_COLORS[p.color] || '#2980b9';\n  const overdue = p.deadline && isOverdue(p.deadline) && p.progress < 100;\n\n  let meta = [];\n  if (p.start)    meta.push(`${isFuture(p.start)?'Starts':'Started'} ${formatDateDisplay(p.start)}`);\n  if (p.deadline) meta.push(`Due ${formatDateDisplay(p.deadline)}${overdue?' · Overdue':''}`);\n  if (pri)        meta.push(pri.label);\n\n  const descText = p.desc\n    ? p.desc.replace(/[#*_`~>]/g,'').replace(/\\n/g,' ').slice(0, 120) + (p.desc.length > 120 ? '…' : '')\n    : '';\n\n  const popup = document.getElementById('ganttPopup');\n  popup.innerHTML = `\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n      <div style=\"width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0\"><\u002Fdiv>\n      <div class=\"gantt-popup-title\" style=\"margin:0\">${escHtml(p.name)}<\u002Fdiv>\n      <button onclick=\"dismissGanttPopup()\" style=\"margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"gantt-popup-meta\">${meta.map(m => `<span>${escHtml(m)}<\u002Fspan>`).join('<span style=\"opacity:0.3\">·<\u002Fspan>')}<\u002Fdiv>\n    <div class=\"gantt-popup-progress\">\n      <div class=\"gantt-popup-progress-fill\" style=\"width:${p.progress}%;background:${color}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:0.06em\">${p.progress}% complete<\u002Fdiv>\n    ${descText ? `<div class=\"gantt-popup-desc\">${escHtml(descText)}<\u002Fdiv>` : ''}\n    <div class=\"gantt-popup-actions\">\n      <button class=\"gantt-popup-btn\" onclick=\"dismissGanttPopup();openEditProject('${p.id}')\">✎ Edit<\u002Fbutton>\n      ${p.status !== 'active' ? `<button class=\"gantt-popup-btn\" onclick=\"dismissGanttPopup();setProjectStatus('${p.id}','active')\">Activate<\u002Fbutton>` : ''}\n      ${p.status !== 'shelved' ? `<button class=\"gantt-popup-btn\" onclick=\"dismissGanttPopup();setProjectStatus('${p.id}','shelved')\">Shelve<\u002Fbutton>` : ''}\n      ${p.status !== 'archived' ? `<button class=\"gantt-popup-btn\" onclick=\"dismissGanttPopup();setProjectStatus('${p.id}','archived')\">Archive<\u002Fbutton>` : ''}\n    <\u002Fdiv>`;\n\n  // Position popup near click, keeping it on screen\n  popup.style.display = 'block';\n  const vw = window.innerWidth;\n  const vh = window.innerHeight;\n  let x = e.clientX + 10;\n  let y = e.clientY + 10;\n  if (x + 270 > vw) x = e.clientX - 270;\n  if (y + popup.offsetHeight + 20 > vh) y = e.clientY - popup.offsetHeight - 10;\n  popup.style.left = Math.max(8, x) + 'px';\n  popup.style.top  = Math.max(8, y) + 'px';\n\n  // Dismiss on outside click\n  setTimeout(() => {\n    document.addEventListener('click', dismissGanttPopup, { once: true });\n  }, 10);\n}\n\nfunction dismissGanttPopup() {\n  const popup = document.getElementById('ganttPopup');\n  if (popup) popup.style.display = 'none';\n}\n\n// ─── KANBAN COLUMN DRAG ─────────────────────────────────\nlet _kanbanDragId = null;\n\nfunction kanbanDragStart(e, tabId) {\n  _kanbanDragId = tabId;\n  e.dataTransfer.effectAllowed = 'move';\n  // Only dim the column, not block child clicks\n  const col = document.getElementById('kcol-' + tabId);\n  if (col) col.style.opacity = '0.5';\n  // Stop propagation so card clicks don't accidentally trigger drag\n  e.stopPropagation();\n}\nfunction kanbanDragOver(e) {\n  if (!_kanbanDragId) return;\n  e.preventDefault();\n  e.dataTransfer.dropEffect = 'move';\n  const col = e.currentTarget;\n  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-target'));\n  if (col) col.classList.add('drag-target');\n}\nfunction kanbanDrop(e, toTabId) {\n  e.preventDefault();\n  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-target'));\n  if (!_kanbanDragId || _kanbanDragId === toTabId) return;\n  const fromIdx = state.tabs.findIndex(t => t.id === _kanbanDragId);\n  const toIdx   = state.tabs.findIndex(t => t.id === toTabId);\n  if (fromIdx < 0 || toIdx < 0) return;\n  const tabs = [...state.tabs];\n  const [moved] = tabs.splice(fromIdx, 1);\n  tabs.splice(toIdx, 0, moved);\n  state.tabs = tabs;\n  _kanbanDragId = null;\n  saveState();\n  renderKanban();\n}\nfunction kanbanDragEnd(e) {\n  _kanbanDragId = null;\n  document.querySelectorAll('.kanban-col').forEach(c => { c.style.opacity = ''; c.classList.remove('drag-target'); });\n}\n\n// ─── SWIPE GESTURE ──────────────────────────────────────\n(function initSwipe() {\n  let touchStartX = 0;\n  let touchStartY = 0;\n  let touchStartTime = 0;\n  const SWIPE_THRESHOLD   = 50;  // min px horizontal travel\n  const SWIPE_MAX_ANGLE   = 40;  // max degrees off horizontal\n  const SWIPE_MAX_DURATION = 600; // max ms for a swipe\n\n  function getContent() { return document.getElementById('mainContent'); }\n\n  function switchList(direction) {\n    if (isDesktop()) return;\n    const idx     = state.tabs.findIndex(t => t.id === state.activeTab);\n    const nextIdx = direction === 'left' ? idx + 1 : idx - 1;\n\n    // Boundary: nudge and return\n    if (nextIdx < 0 || nextIdx >= state.tabs.length) {\n      const el = getContent();\n      if (!el) return;\n      const nudge = direction === 'left' ? 'swipe-out-left' : 'swipe-out-right';\n      el.style.transition = 'none';\n      el.classList.add(nudge);\n      requestAnimationFrame(() => {\n        requestAnimationFrame(() => {\n          el.style.transition = '';\n          el.classList.remove(nudge);\n        });\n      });\n      return;\n    }\n\n    const el = getContent();\n    if (!el) return;\n\n    const outCls = direction === 'left' ? 'swipe-out-left' : 'swipe-out-right';\n    const inCls  = direction === 'left' ? 'swipe-in-left'  : 'swipe-in-right';\n\n    // Step 1: animate current content out\n    el.classList.add(outCls);\n    el.style.pointerEvents = 'none';\n\n    setTimeout(() => {\n      // Step 2: switch list and render new content — but keep it invisible first\n      state.activeTab = state.tabs[nextIdx].id;\n      saveState();\n      renderTabs();\n\n      // Render new content with transition disabled and starting position set\n      el.style.transition = 'none';\n      el.classList.remove(outCls);\n      el.classList.add(inCls);\n\n      // Render the new content into the element\n      renderContent();\n\n      el.style.pointerEvents = '';\n\n      // Step 3: force reflow, then remove the in-class to trigger the slide-in\n      requestAnimationFrame(() => {\n        requestAnimationFrame(() => {\n          el.style.transition = '';\n          el.classList.remove(inCls);\n        });\n      });\n    }, 190);\n  }\n\n  document.addEventListener('touchstart', e => {\n    if (isDesktop()) return;\n    // Ignore touches inside overlays or the tab bar\n    if (e.target.closest('.overlay.open') ||\n        e.target.closest('.tabs-wrapper') ||\n        e.target.closest('.fab')) return;\n    touchStartX    = e.touches[0].clientX;\n    touchStartY    = e.touches[0].clientY;\n    touchStartTime = Date.now();\n  }, { passive: true });\n\n  document.addEventListener('touchend', e => {\n    if (isDesktop()) return;\n    if (e.target.closest('.overlay.open') ||\n        e.target.closest('.tabs-wrapper') ||\n        e.target.closest('.fab')) return;\n\n    const dx       = e.changedTouches[0].clientX - touchStartX;\n    const dy       = e.changedTouches[0].clientY - touchStartY;\n    const dt       = Date.now() - touchStartTime;\n    const angle    = Math.abs(Math.atan2(Math.abs(dy), Math.abs(dx)) * 180 / Math.PI);\n    const absDx    = Math.abs(dx);\n\n    if (dt > SWIPE_MAX_DURATION) return;\n    if (absDx < SWIPE_THRESHOLD) return;\n    if (angle > SWIPE_MAX_ANGLE) return; // too vertical — likely a scroll\n\n    // Swipe left = go to next list; swipe right = go to previous list\n    if (dx < 0) switchList('left');\n    else        switchList('right');\n  }, { passive: true });\n})();\n\n// ─── APP INIT (called after auth is resolved) ───────────\nasync function initApp() {\n  document.getElementById('headerDate').textContent =\n    new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});\n  lsReady = lsAvailable();\n  try { await openDB(); dbReady = true; } catch(e) { dbReady = false; }\n  await loadPersistedState();\n  startConnectivityPolling();\n  render();\n}\n\n// ─── INIT ───────────────────────────────────────────────\n(async function init() {\n  // Always check Supabase session first — before anything in localStorage.\n  // This ensures a valid cloud session is never overridden by a stale 'local' flag.\n\n  // Handle magic link redirect — Supabase puts tokens in the URL hash\n  const hash = window.location.hash;\n  if (hash && hash.includes('access_token')) {\n    const { data, error } = await _supa.auth.getSession();\n    window.history.replaceState(null, '', window.location.pathname);\n    if (!error && data.session && data.session.user) {\n      _authUser = data.session.user;\n      _authMode = 'cloud';\n      lsSet('proj_auth_mode', 'cloud');\n      updateUserChip();\n      await initApp();\n      return;\n    }\n  }\n\n  // Check for existing Supabase session — this works even if localStorage says 'local'\n  try {\n    const { data: { session } } = await _supa.auth.getSession();\n    if (session && session.user) {\n      _authUser = session.user;\n      _authMode = 'cloud';\n      lsSet('proj_auth_mode', 'cloud'); // fix any stale 'local' flag\n      updateUserChip();\n      await initApp();\n      return;\n    }\n  } catch(e) {\n    console.warn('Session check failed:', e);\n  }\n\n  // No active Supabase session — check if user previously chose local-only\n  const savedMode = lsGet('proj_auth_mode');\n  if (savedMode === 'local') {\n    _authMode = 'local';\n    _authUser = null;\n    updateUserChip();\n    await initApp();\n    return;\n  }\n\n  // New visitor or session expired — show auth screen\n  showAuthScreen();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
